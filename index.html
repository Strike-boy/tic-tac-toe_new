<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON Tic-Tac-Toe Pro</title>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-green: #39ff14;
            --neon-purple: #bf00ff;
            --dark-bg: #0a0a1a;
            --darker-bg: #050510;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--darker-bg);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 255, 0.1) 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.1) 0%, transparent 25%),
                radial-gradient(circle at 40% 80%, rgba(57, 255, 20, 0.1) 0%, transparent 25%);
            z-index: -1;
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.2);
        }

        h1 {
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
        }

        .btn.neon-pink {
            background: linear-gradient(45deg, rgba(255, 0, 255, 0.2), rgba(191, 0, 255, 0.2));
            border: 1px solid var(--neon-pink);
        }

        .btn.neon-blue {
            background: linear-gradient(45deg, rgba(0, 255, 255, 0.2), rgba(0, 191, 255, 0.2));
            border: 1px solid var(--neon-blue);
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            margin-top: 20px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .board {
            display: grid;
            gap: 10px;
            margin: 20px 0;
            justify-content: center;
        }

        .board-3x3 { grid-template-columns: repeat(3, 80px); }
        .board-4x4 { grid-template-columns: repeat(4, 70px); }
        .board-5x5 { grid-template-columns: repeat(5, 60px); }

        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .cell.x { color: var(--neon-pink); }
        .cell.o { color: var(--neon-blue); }

        .game-info {
            text-align: center;
            margin: 15px 0;
        }

        .status {
            font-size: 1.3rem;
            color: var(--neon-green);
            margin-bottom: 10px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }

        .score-item {
            text-align: center;
            padding: 10px;
        }

        .score-value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .game-controls {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .control-btn {
            flex: 1;
            padding: 10px;
        }

        .hidden {
            display: none;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            .board-3x3 { grid-template-columns: repeat(3, 70px); }
            .board-4x4 { grid-template-columns: repeat(4, 60px); }
            .board-5x5 { grid-template-columns: repeat(5, 50px); }
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <!-- Главное меню -->
    <div id="mainMenu" class="screen active">
        <div class="container">
            <h1>NEON TIC-TAC-TOE</h1>
            <button class="btn neon-pink" onclick="showScreen('localMenu')">🎮 Локальная игра</button>
            <button class="btn neon-blue" onclick="showScreen('aiMenu')">🤖 Игра с ИИ</button>
            <button class="btn" onclick="showScreen('onlineMenu')">🌐 Онлайн матч</button>
            <button class="btn" onclick="showScreen('settings')">⚙️ Настройки</button>
        </div>
    </div>

    <!-- Локальная игра -->
    <div id="localMenu" class="screen">
        <div class="container">
            <h2>Локальная игра</h2>
            <button class="btn" onclick="startGame('local', '3x3')">3x3 (Классика)</button>
            <button class="btn" onclick="startGame('local', '4x4')">4x4 (Средний)</button>
            <button class="btn" onclick="startGame('local', '5x5')">5x5 (Сложный)</button>
            <button class="btn btn-back" onclick="showScreen('mainMenu')">← Назад</button>
        </div>
    </div>

    <!-- Игра с ИИ -->
    <div id="aiMenu" class="screen">
        <div class="container">
            <h2>Игра с ИИ</h2>
            <button class="btn" onclick="startGame('ai-easy', '3x3')">🥉 Легкий (3x3)</button>
            <button class="btn" onclick="startGame('ai-medium', '3x3')">🥈 Средний (3x3)</button>
            <button class="btn" onclick="startGame('ai-hard', '3x3')">🥇 Сложный (3x3)</button>
            <button class="btn btn-back" onclick="showScreen('mainMenu')">← Назад</button>
        </div>
    </div>

    <!-- Онлайн игра -->
    <div id="onlineMenu" class="screen">
        <div class="container">
            <h2>Онлайн матч</h2>
            <button class="btn neon-pink" onclick="showScreen('createRoom')">➕ Создать комнату</button>
            <button class="btn neon-blue" onclick="showScreen('joinRoom')">🔗 Присоединиться</button>
            <button class="btn btn-back" onclick="showScreen('mainMenu')">← Назад</button>
        </div>
    </div>

    <!-- Создание комнаты -->
    <div id="createRoom" class="screen">
        <div class="container">
            <h2>Создать комнату</h2>
            <input type="text" id="playerName" placeholder="Твой никнейм" value="Игрок">
            <button class="btn neon-pink" onclick="createRoom()">Создать комнату</button>
            <div id="roomInfo" class="hidden">
                <div class="game-info">
                    <p>Код комнаты: <strong id="roomCode"></strong></p>
                    <button class="btn" onclick="copyRoomCode()">📋 Скопировать код</button>
                </div>
            </div>
            <button class="btn btn-back" onclick="showScreen('onlineMenu')">← Назад</button>
        </div>
    </div>

    <!-- Присоединение к комнате -->
    <div id="joinRoom" class="screen">
        <div class="container">
            <h2>Присоединиться к комнате</h2>
            <input type="text" id="joinPlayerName" placeholder="Твой никнейм" value="Игрок">
            <input type="text" id="joinCodeInput" placeholder="Код комнаты">
            <button class="btn neon-blue" onclick="joinRoom()">Присоединиться</button>
            <div id="joinStatus" class="game-info"></div>
            <button class="btn btn-back" onclick="showScreen('onlineMenu')">← Назад</button>
        </div>
    </div>

    <!-- Настройки -->
    <div id="settings" class="screen">
        <div class="container">
            <h2>Настройки</h2>
            <div class="game-info">
                <label>
                    <input type="checkbox" id="soundToggle" checked> 🔊 Звуковые эффекты
                </label>
            </div>
            <button class="btn btn-back" onclick="showScreen('mainMenu')">← Назад</button>
        </div>
    </div>

    <!-- Игровой экран -->
    <div id="gameScreen" class="screen">
        <div class="container">
            <div class="game-header">
                <button class="btn btn-back" onclick="returnToMenu()">🏠 Меню</button>
                <div id="gameMode"></div>
            </div>

            <div class="game-info">
                <div class="status" id="gameStatus">Ход: ❌</div>
            </div>

            <div class="board" id="gameBoard">
                <!-- Игровое поле генерируется динамически -->
            </div>

            <div class="score-board">
                <div class="score-item">
                    <div>❌</div>
                    <div class="score-value" id="scoreX">0</div>
                </div>
                <div class="score-item">
                    <div>🤝</div>
                    <div class="score-value" id="scoreT">0</div>
                </div>
                <div class="score-item">
                    <div>⭕</div>
                    <div class="score-value" id="scoreO">0</div>
                </div>
            </div>

            <div class="game-controls">
                <button class="btn control-btn" onclick="restartGame()">🔄 Рестарт</button>
            </div>
        </div>
    </div>

    <script>
        // ====== КОНСТАНТЫ ======
        const BACKEND_BASE = "https://tic-tac-toe-site.onrender.com";

        // ====== ПЕРЕМЕННЫЕ ======
        let currentGame = {
            mode: null, // 'local', 'ai-easy', 'ai-medium', 'ai-hard', 'online'
            boardSize: '3x3',
            board: [],
            currentPlayer: 'X',
            gameActive: false,
            scores: { X: 0, O: 0, T: 0 }
        };

        let onlineGame = {
            ws: null,
            roomCode: '',
            mySymbol: '',
            opponentName: '',
            connected: false
        };

        let soundEnabled = true;

        // ====== УПРАВЛЕНИЕ ЭКРАНАМИ ======
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function returnToMenu() {
            if (onlineGame.ws) {
                onlineGame.ws.close();
                onlineGame.ws = null;
            }
            showScreen('mainMenu');
        }

        // ====== ИНИЦИАЛИЗАЦИЯ ИГРЫ ======
        function startGame(mode, boardSize) {
            currentGame.mode = mode;
            currentGame.boardSize = boardSize;
            currentGame.board = createEmptyBoard(boardSize);
            currentGame.currentPlayer = 'X';
            currentGame.gameActive = true;

            setupGameBoard();
            updateGameDisplay();
            showScreen('gameScreen');

            // Установка текста режима
            const modeText = getModeText(mode, boardSize);
            document.getElementById('gameMode').textContent = modeText;

            // Если это ИИ и он ходит первым
            if (mode.startsWith('ai') && currentGame.currentPlayer === 'O') {
                setTimeout(makeAIMove, 500);
            }
        }

        function createEmptyBoard(boardSize) {
            const size = parseInt(boardSize[0]);
            return Array(size * size).fill('');
        }

        function setupGameBoard() {
            const board = document.getElementById('gameBoard');
            const size = parseInt(currentGame.boardSize[0]);
            
            board.innerHTML = '';
            board.className = `board board-${size}x${size}`;

            for (let i = 0; i < size * size; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.addEventListener('click', () => makeMove(i));
                board.appendChild(cell);
            }
        }

        // ====== ИГРОВАЯ ЛОГИКА ======
        function makeMove(index) {
            if (!currentGame.gameActive) return;
            if (currentGame.board[index] !== '') return;

            // Для онлайн-игры
            if (currentGame.mode === 'online') {
                if (!onlineGame.connected || currentGame.currentPlayer !== onlineGame.mySymbol) {
                    showMessage('Сейчас не ваш ход');
                    return;
                }
                
                onlineGame.ws.send(JSON.stringify({ 
                    type: 'move', 
                    index: index 
                }));
                return;
            }

            // Для локальной игры и ИИ
            currentGame.board[index] = currentGame.currentPlayer;
            updateBoard();
            playSound('move');

            const winner = checkWinner();
            if (winner) {
                endGame(winner);
            } else {
                currentGame.currentPlayer = currentGame.currentPlayer === 'X' ? 'O' : 'X';
                updateGameDisplay();

                // Ход ИИ
                if (currentGame.mode.startsWith('ai') && currentGame.currentPlayer === 'O') {
                    setTimeout(makeAIMove, 500);
                }
            }
        }

        function makeAIMove() {
            if (!currentGame.gameActive || currentGame.currentPlayer !== 'O') return;

            const difficulty = currentGame.mode.split('-')[1] || 'medium';
            const move = getAIMove(difficulty);
            
            if (move !== -1) {
                currentGame.board[move] = 'O';
                updateBoard();
                playSound('move');

                const winner = checkWinner();
                if (winner) {
                    endGame(winner);
                } else {
                    currentGame.currentPlayer = 'X';
                    updateGameDisplay();
                }
            }
        }

        function getAIMove(difficulty) {
            const emptyCells = currentGame.board
                .map((cell, index) => cell === '' ? index : -1)
                .filter(index => index !== -1);

            if (emptyCells.length === 0) return -1;

            switch (difficulty) {
                case 'easy':
                    return emptyCells[Math.floor(Math.random() * emptyCells.length)];

                case 'medium':
                    // Пытается выиграть или блокировать
                    const winMove = findWinningMove('O');
                    if (winMove !== -1) return winMove;

                    const blockMove = findWinningMove('X');
                    if (blockMove !== -1) return blockMove;

                    return emptyCells[Math.floor(Math.random() * emptyCells.length)];

                case 'hard':
                    return findBestMove();
            }

            return emptyCells[0];
        }

        function findWinningMove(player) {
            const size = parseInt(currentGame.boardSize[0]);
            
            for (let i = 0; i < currentGame.board.length; i++) {
                if (currentGame.board[i] === '') {
                    currentGame.board[i] = player;
                    const winner = checkWinner();
                    currentGame.board[i] = '';
                    
                    if (winner === player) return i;
                }
            }
            return -1;
        }

        function findBestMove() {
            const emptyCells = currentGame.board
                .map((cell, index) => cell === '' ? index : -1)
                .filter(index => index !== -1);

            // Предпочтение центру и углам
            const size = parseInt(currentGame.boardSize[0]);
            const center = Math.floor(size * size / 2);
            if (emptyCells.includes(center)) return center;

            const corners = [0, size-1, size*(size-1), size*size-1];
            for (const corner of corners) {
                if (emptyCells.includes(corner)) return corner;
            }

            return emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }

        function checkWinner() {
            const size = parseInt(currentGame.boardSize[0]);
            const board = currentGame.board;

            // Проверка строк
            for (let row = 0; row < size; row++) {
                for (let col = 0; col <= size - 3; col++) {
                    const idx = row * size + col;
                    if (board[idx] && 
                        board[idx] === board[idx + 1] && 
                        board[idx] === board[idx + 2]) {
                        return board[idx];
                    }
                }
            }

            // Проверка столбцов
            for (let col = 0; col < size; col++) {
                for (let row = 0; row <= size - 3; row++) {
                    const idx = row * size + col;
                    if (board[idx] && 
                        board[idx] === board[idx + size] && 
                        board[idx] === board[idx + 2 * size]) {
                        return board[idx];
                    }
                }
            }

            // Проверка диагоналей
            for (let row = 0; row <= size - 3; row++) {
                for (let col = 0; col <= size - 3; col++) {
                    const idx = row * size + col;
                    if (board[idx] && 
                        board[idx] === board[idx + size + 1] && 
                        board[idx] === board[idx + 2 * size + 2]) {
                        return board[idx];
                    }
                }
            }

            // Проверка обратных диагоналей
            for (let row = 0; row <= size - 3; row++) {
                for (let col = 2; col < size; col++) {
                    const idx = row * size + col;
                    if (board[idx] && 
                        board[idx] === board[idx + size - 1] && 
                        board[idx] === board[idx + 2 * size - 2]) {
                        return board[idx];
                    }
                }
            }

            // Ничья
            if (!board.includes('')) return 'T';

            return null;
        }

        function endGame(winner) {
            currentGame.gameActive = false;
            playSound('win');

            if (winner === 'T') {
                document.getElementById('gameStatus').textContent = 'Ничья! 🤝';
                currentGame.scores.T++;
            } else {
                document.getElementById('gameStatus').textContent = 
                    `Победил ${winner === 'X' ? '❌' : '⭕'}!`;
                currentGame.scores[winner]++;
            }

            updateScores();
        }

        function restartGame() {
            if (currentGame.mode === 'online') {
                if (onlineGame.connected) {
                    onlineGame.ws.send(JSON.stringify({ type: 'rematch' }));
                }
            } else {
                currentGame.board = createEmptyBoard(currentGame.boardSize);
                currentGame.currentPlayer = 'X';
                currentGame.gameActive = true;
                
                updateBoard();
                updateGameDisplay();

                if (currentGame.mode.startsWith('ai') && currentGame.currentPlayer === 'O') {
                    setTimeout(makeAIMove, 500);
                }
            }
        }

        // ====== ОНЛАЙН-ИГРА ======
        async function createRoom() {
            const playerName = document.getElementById('playerName').value || 'Игрок';
            
            try {
                const response = await fetch(BACKEND_BASE + '/create', { 
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ board_size: '3x3' })
                });
                
                if (!response.ok) throw new Error('Network error');
                
                const data = await response.json();
                onlineGame.roomCode = data.code;
                
                document.getElementById('roomCode').textContent = data.code;
                document.getElementById('roomInfo').classList.remove('hidden');
                
                connectWebSocket(data.code, playerName);
                
            } catch (error) {
                showMessage('Ошибка создания комнаты');
            }
        }

        function joinRoom() {
            const playerName = document.getElementById('joinPlayerName').value || 'Игрок';
            const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
            
            if (!code) {
                showMessage('Введите код комнаты');
                return;
            }

            document.getElementById('joinStatus').textContent = 'Соединяюсь...';
            connectWebSocket(code, playerName);
        }

        function connectWebSocket(code, name) {
            const backendHost = BACKEND_BASE.replace(/^https?:\/\//, '');
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${backendHost}/ws/${code}?name=${encodeURIComponent(name)}`;
            
            onlineGame.ws = new WebSocket(wsUrl);
            onlineGame.roomCode = code;
            
            onlineGame.ws.onopen = () => {
                showMessage('Подключено, ожидаем соперника...');
            };
            
            onlineGame.ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    handleWebSocketMessage(message);
                } catch (error) {
                    console.error('Ошибка парсинга:', error);
                }
            };
            
            onlineGame.ws.onclose = () => {
                onlineGame.connected = false;
                if (currentGame.mode === 'online') {
                    showMessage('Соединение разорвано');
                }
            };
            
            onlineGame.ws.onerror = (error) => {
                showMessage('Ошибка подключения');
            };
        }

        function handleWebSocketMessage(message) {
            console.log('Получено:', message);
            
            switch (message.type) {
                case 'waiting':
                    showMessage('Ожидаем соперника...');
                    onlineGame.mySymbol = message.your_symbol;
                    break;
                    
                case 'ready':
                    currentGame.mode = 'online';
                    currentGame.boardSize = message.board_size || '3x3';
                    currentGame.board = message.board || [];
                    currentGame.currentPlayer = message.turn;
                    currentGame.gameActive = true;
                    
                    onlineGame.mySymbol = message.your_symbol;
                    onlineGame.opponentName = message.opponent;
                    onlineGame.connected = true;
                    
                    setupGameBoard();
                    updateBoard();
                    updateGameDisplay();
                    showScreen('gameScreen');
                    
                    document.getElementById('gameMode').textContent = 
                        `Онлайн vs ${onlineGame.opponentName}`;
                    break;
                    
                case 'move_made':
                    currentGame.board = message.board;
                    currentGame.currentPlayer = message.turn;
                    updateBoard();
                    updateGameDisplay();
                    playSound('move');
                    break;
                    
                case 'game_end':
                    currentGame.gameActive = false;
                    document.getElementById('gameStatus').textContent = message.message;
                    
                    if (message.winner && message.winner !== 'D') {
                        currentGame.scores[message.winner]++;
                        updateScores();
                        playSound('win');
                    }
                    break;
                    
                case 'error':
                    showMessage(message.msg);
                    break;
            }
        }

        function copyRoomCode() {
            navigator.clipboard.writeText(onlineGame.roomCode);
            showMessage('Код скопирован!');
        }

        // ====== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ======
        function updateBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, index) => {
                cell.textContent = currentGame.board[index] ? 
                    (currentGame.board[index] === 'X' ? '❌' : '⭕') : '';
                cell.className = 'cell';
                if (currentGame.board[index] === 'X') cell.classList.add('x');
                if (currentGame.board[index] === 'O') cell.classList.add('o');
            });
        }

        function updateGameDisplay() {
            document.getElementById('gameStatus').textContent = 
                `Ход: ${currentGame.currentPlayer === 'X' ? '❌' : '⭕'}`;
        }

        function updateScores() {
            document.getElementById('scoreX').textContent = currentGame.scores.X;
            document.getElementById('scoreO').textContent = currentGame.scores.O;
            document.getElementById('scoreT').textContent = currentGame.scores.T;
        }

        function getModeText(mode, boardSize) {
            const modes = {
                'local': 'Локальная игра',
                'ai-easy': 'ИИ: Легкий',
                'ai-medium': 'ИИ: Средний', 
                'ai-hard': 'ИИ: Сложный',
                'online': 'Онлайн игра'
            };
            return `${modes[mode]} (${boardSize})`;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            
            // Простые звуковые эффекты через Web Audio API
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                let frequency = 800;
                let duration = 0.1;
                
                if (type === 'win') {
                    frequency = 600;
                    duration = 0.5;
                }
                
                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        function showMessage(message) {
            const statusElement = document.getElementById('joinStatus') || 
                                document.getElementById('gameStatus');
            if (statusElement) {
                statusElement.textContent = message;
            }
        }

        // ====== ИНИЦИАЛИЗАЦИЯ ======
        document.addEventListener('DOMContentLoaded', () => {
            // Настройка звука
            const soundToggle = document.getElementById('soundToggle');
            if (soundToggle) {
                soundToggle.addEventListener('change', (e) => {
                    soundEnabled = e.target.checked;
                });
            }
            
            // Загрузка сохраненных настроек
            const savedSound = localStorage.getItem('soundEnabled');
            if (savedSound !== null) {
                soundEnabled = JSON.parse(savedSound);
                if (soundToggle) soundToggle.checked = soundEnabled;
            }
        });

        // Сохранение настроек при изменении
        document.getElementById('soundToggle')?.addEventListener('change', function() {
            soundEnabled = this.checked;
            localStorage.setItem('soundEnabled', JSON.stringify(soundEnabled));
        });
    </script>
</body>
</html>
