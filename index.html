<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEON Tic-Tac-Toe</title>
<style>
  :root {
    --neon-pink: #ff00ff;
    --neon-blue: #00ffff;
    --neon-green: #39ff14;
    --neon-purple: #bf00ff;
    --dark-bg: #0a0a1a;
    --darker-bg: #050510;
    --glass: rgba(255, 255, 255, 0.05);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: var(--darker-bg);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(255, 0, 255, 0.1) 0%, transparent 20%),
      radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.1) 0%, transparent 20%),
      radial-gradient(circle at 50% 80%, rgba(57, 255, 20, 0.1) 0%, transparent 20%);
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 1000px;
    background: var(--glass);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 
      0 0 50px rgba(255, 0, 255, 0.2),
      0 0 75px rgba(0, 255, 255, 0.2),
      inset 0 0 50px rgba(0, 0, 0, 0.3);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .title {
    font-size: 2.2rem;
    font-weight: 800;
    background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue), var(--neon-green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
  }

  .subtitle {
    font-size: 1rem;
    opacity: 0.8;
    margin-top: 5px;
  }

  .controls {
    display: flex;
    gap: 12px;
  }

  .btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: white;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: translateY(-2px);
    box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
  }

  .btn.neon-pink {
    background: linear-gradient(45deg, rgba(255, 0, 255, 0.2), rgba(191, 0, 255, 0.2));
    border: 1px solid var(--neon-pink);
    box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
  }

  .btn.neon-blue {
    background: linear-gradient(45deg, rgba(0, 255, 255, 0.2), rgba(0, 191, 255, 0.2));
    border: 1px solid var(--neon-blue);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 25px;
  }

  .game-section {
    background: rgba(0, 0, 0, 0.2);
    padding: 20px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .game-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .mode-badge {
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    font-weight: 600;
  }

  .player-info {
    text-align: right;
  }

  .timer {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--neon-green);
    text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 20px 0;
  }

  .cell {
    aspect-ratio: 1;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .cell:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .cell.x {
    color: var(--neon-pink);
    text-shadow: 0 0 15px var(--neon-pink);
  }

  .cell.o {
    color: var(--neon-blue);
    text-shadow: 0 0 15px var(--neon-blue);
  }

  .cell.winner {
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .cell::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transition: left 0.5s;
  }

  .cell:hover::before {
    left: 100%;
  }

  .status {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 600;
    margin: 15px 0;
    color: var(--neon-green);
    text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
  }

  .score-board {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 15px;
  }

  .score-item {
    text-align: center;
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .score-value {
    font-size: 1.5rem;
    font-weight: 700;
  }

  .score-x { color: var(--neon-pink); }
  .score-o { color: var(--neon-blue); }
  .score-t { color: var(--neon-green); }

  .menu-section {
    background: rgba(0, 0, 0, 0.2);
    padding: 20px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .mode-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .mode-btn {
    flex: 1;
    text-align: center;
    padding: 15px;
  }

  .panel {
    margin-top: 20px;
  }

  .input-group {
    margin-bottom: 15px;
  }

  .input-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
    color: var(--neon-blue);
  }

  .input-group input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: white;
    font-size: 1rem;
  }

  .input-group input:focus {
    outline: none;
    border-color: var(--neon-blue);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }

  .action-buttons {
    display: flex;
    gap: 10px;
    margin: 15px 0;
  }

  .action-btn {
    flex: 1;
    text-align: center;
  }

  .chat-container {
    margin-top: 25px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 15px;
  }

  .chat-messages {
    height: 150px;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .chat-input {
    display: flex;
    gap: 10px;
  }

  .chat-input input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: white;
  }

  .hidden {
    display: none;
  }

  .online-status {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    text-align: center;
  }

  /* Анимации */
  @keyframes appear {
    from {
      opacity: 0;
      transform: scale(0.8);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .cell.x, .cell.o {
    animation: appear 0.3s ease-out;
  }

  /* Адаптивность */
  @media (max-width: 900px) {
    .main-grid {
      grid-template-columns: 1fr;
    }
    
    .header {
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }
    
    .title {
      font-size: 1.8rem;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <div class="title">NEON TIC-TAC-TOE</div>
        <div class="subtitle">Игра будущего уже здесь</div>
      </div>
      <div class="controls">
        <button class="btn neon-pink" id="resetAll">🔄 Новая игра</button>
        <button class="btn neon-blue" id="restartBtn">⚡ Рестарт</button>
      </div>
    </div>

    <div class="main-grid">
      <div class="game-section">
        <div class="game-info">
          <div class="mode-badge" id="modeLabel">Локально</div>
          <div class="player-info">
            <div>Вы: <strong id="myNameDisplay">Гость</strong></div>
            <div>Соперник: <strong id="opponentNameDisplay">—</strong></div>
          </div>
        </div>

        <div class="timer" id="timer">30</div>
        
        <div class="board" id="board">
          <div class="cell" data-index="0"></div>
          <div class="cell" data-index="1"></div>
          <div class="cell" data-index="2"></div>
          <div class="cell" data-index="3"></div>
          <div class="cell" data-index="4"></div>
          <div class="cell" data-index="5"></div>
          <div class="cell" data-index="6"></div>
          <div class="cell" data-index="7"></div>
          <div class="cell" data-index="8"></div>
        </div>

        <div class="status" id="status">Ход: ❌</div>
        
        <div class="score-board">
          <div class="score-item">
            <div>❌</div>
            <div class="score-value score-x" id="scoreX">0</div>
          </div>
          <div class="score-item">
            <div>🤝</div>
            <div class="score-value score-t" id="scoreT">0</div>
          </div>
          <div class="score-item">
            <div>⭕</div>
            <div class="score-value score-o" id="scoreO">0</div>
          </div>
        </div>
      </div>

      <div class="menu-section">
        <div class="mode-selector">
          <button class="btn mode-btn" id="btnLocal">🎮 Локально</button>
          <button class="btn mode-btn" id="btnOnline">🌐 Онлайн</button>
        </div>

        <div id="localPanel">
          <div class="input-group">
            <label>Ваш никнейм</label>
            <input id="localName" type="text" placeholder="Неоновый воин" />
          </div>
          
          <div class="action-buttons">
            <button class="btn action-btn" id="btnVsAI">🤖 Играть с ИИ</button>
          </div>
        </div>

        <div id="onlinePanel" class="hidden">
          <div class="input-group">
            <label>Твой никнейм</label>
            <input id="onlineName" type="text" placeholder="Неоновый воин" />
          </div>

          <div class="action-buttons">
            <button class="btn neon-pink action-btn" id="createBtn">➕ Создать комнату</button>
            <button class="btn neon-blue action-btn" id="joinBtn">🔗 Присоединиться</button>
          </div>

          <div id="createPanel" class="hidden">
            <div class="input-group">
              <label>Код комнаты</label>
              <input id="roomCode" type="text" readonly />
            </div>
            <button class="btn action-btn" id="copyCode">📋 Скопировать код</button>
          </div>

          <div id="joinPanel" class="hidden">
            <div class="input-group">
              <label>Введите код комнаты</label>
              <input id="joinCodeInput" type="text" placeholder="ABCD" />
            </div>
            <button class="btn action-btn" id="joinRoomBtn">🚀 Войти</button>
            <div id="joinMsg" class="online-status"></div>
          </div>

          <div id="onlineInfo" class="online-status">Отключено</div>

          <div class="chat-container">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
              <input type="text" id="chatInput" placeholder="Сообщение..." />
              <button class="btn" id="sendChatBtn">📨</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
// ====== КОНФИГУРАЦИЯ ======
const BACKEND_BASE = "https://tic-tac-toe-site.onrender.com";

// ====== ПЕРЕМЕННЫЕ ======
let currentMode = 'local';
let gameActive = true;
let currentPlayer = 'X';
let gameBoard = ['', '', '', '', '', '', '', '', ''];
let scores = { X: 0, O: 0, T: 0 };
let isAIGame = false;

// Онлайн-режим
let wsConnection = null;
let roomCode = '';
let mySymbol = '';
let opponentName = '';
let gameTimer = null;
let timeLeft = 30;

// ====== DOM ЭЛЕМЕНТЫ ======
const elements = {
    // Кнопки режимов
    btnLocal: document.getElementById('btnLocal'),
    btnOnline: document.getElementById('btnOnline'),
    
    // Панели
    localPanel: document.getElementById('localPanel'),
    onlinePanel: document.getElementById('onlinePanel'),
    createPanel: document.getElementById('createPanel'),
    joinPanel: document.getElementById('joinPanel'),
    
    // Поля ввода
    localName: document.getElementById('localName'),
    onlineName: document.getElementById('onlineName'),
    roomCode: document.getElementById('roomCode'),
    joinCodeInput: document.getElementById('joinCodeInput'),
    
    // Кнопки действий
    createBtn: document.getElementById('createBtn'),
    joinBtn: document.getElementById('joinBtn'),
    joinRoomBtn: document.getElementById('joinRoomBtn'),
    copyCode: document.getElementById('copyCode'),
    btnVsAI: document.getElementById('btnVsAI'),
    resetAll: document.getElementById('resetAll'),
    restartBtn: document.getElementById('restartBtn'),
    sendChatBtn: document.getElementById('sendChatBtn'),
    
    // Игровые элементы
    board: document.getElementById('board'),
    status: document.getElementById('status'),
    timer: document.getElementById('timer'),
    modeLabel: document.getElementById('modeLabel'),
    myNameDisplay: document.getElementById('myNameDisplay'),
    opponentNameDisplay: document.getElementById('opponentNameDisplay'),
    onlineInfo: document.getElementById('onlineInfo'),
    joinMsg: document.getElementById('joinMsg'),
    chatMessages: document.getElementById('chatMessages'),
    chatInput: document.getElementById('chatInput'),
    
    // Счет
    scoreX: document.getElementById('scoreX'),
    scoreO: document.getElementById('scoreO'),
    scoreT: document.getElementById('scoreT')
};

// ====== ИНИЦИАЛИЗАЦИЯ ======
function initGame() {
    setupEventListeners();
    resetGame();
    updateDisplay();
}

function setupEventListeners() {
    // Кнопки режимов
    elements.btnLocal.addEventListener('click', () => switchMode('local'));
    elements.btnOnline.addEventListener('click', () => switchMode('online'));
    
    // Кнопки онлайн-режима
    elements.createBtn.addEventListener('click', createRoom);
    elements.joinBtn.addEventListener('click', showJoinPanel);
    elements.joinRoomBtn.addEventListener('click', joinRoom);
    elements.copyCode.addEventListener('click', copyRoomCode);
    
    // Кнопки управления
    elements.resetAll.addEventListener('click', resetGame);
    elements.restartBtn.addEventListener('click', restartGame);
    elements.btnVsAI.addEventListener('click', startAIGame);
    elements.sendChatBtn.addEventListener('click', sendChat);
    elements.chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendChat();
    });
    
    // Обработчики клеток
    const cells = document.querySelectorAll('.cell');
    cells.forEach((cell, index) => {
        cell.addEventListener('click', () => makeMove(index));
    });
}

// ====== ОСНОВНАЯ ИГРОВАЯ ЛОГИКА ======
function switchMode(mode) {
    currentMode = mode;
    elements.modeLabel.textContent = mode === 'local' ? 'Локально' : 'Онлайн';
    elements.localPanel.classList.toggle('hidden', mode !== 'local');
    elements.onlinePanel.classList.toggle('hidden', mode !== 'online');
    
    if (wsConnection) {
        wsConnection.close();
        wsConnection = null;
    }
    
    resetGame();
}

function resetGame() {
    gameBoard = ['', '', '', '', '', '', '', '', ''];
    gameActive = true;
    currentPlayer = 'X';
    timeLeft = 30;
    
    elements.createPanel.classList.add('hidden');
    elements.joinPanel.classList.add('hidden');
    elements.onlineInfo.textContent = 'Отключено';
    elements.joinMsg.textContent = '';
    
    updateBoard();
    updateStatus();
    updateTimer();
    clearChat();
    
    if (currentMode === 'local') {
        const name = elements.localName.value || 'Неоновый воин';
        elements.myNameDisplay.textContent = name;
        elements.opponentNameDisplay.textContent = isAIGame ? '🤖 ИИ' : '—';
    } else {
        const name = elements.onlineName.value || 'Неоновый воин';
        elements.myNameDisplay.textContent = name;
        elements.opponentNameDisplay.textContent = '—';
    }
}

function restartGame() {
    if (currentMode === 'online' && wsConnection) {
        wsConnection.send(JSON.stringify({ type: 'rematch' }));
    } else {
        resetGame();
    }
}

function makeMove(index) {
    if (!gameActive) return;
    if (gameBoard[index] !== '') return;
    
    if (currentMode === 'local') {
        gameBoard[index] = currentPlayer;
        updateBoard();
        
        const result = checkWinner();
        if (result) {
            handleGameEnd(result);
        } else {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatus();
            
            if (isAIGame && currentPlayer === 'O') {
                setTimeout(makeAIMove, 500);
            }
        }
    } else {
        if (!wsConnection || !gameActive) {
            showMessage('Сначала подключись к игре');
            return;
        }
        
        if (currentPlayer !== mySymbol) {
            showMessage('Сейчас не ваш ход');
            return;
        }
        
        wsConnection.send(JSON.stringify({ 
            type: 'move', 
            index: index 
        }));
    }
}

function checkWinner() {
    const winPatterns = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
    ];
    
    for (const pattern of winPatterns) {
        const [a, b, c] = pattern;
        if (gameBoard[a] && gameBoard[a] === gameBoard[b] && gameBoard[a] === gameBoard[c]) {
            return { winner: gameBoard[a], cells: pattern };
        }
    }
    
    if (!gameBoard.includes('')) {
        return { winner: 'T' };
    }
    
    return null;
}

function handleGameEnd(result) {
    gameActive = false;
    
    if (result.winner === 'T') {
        elements.status.textContent = 'Ничья! 🤝';
        scores.T++;
    } else {
        elements.status.textContent = `Победил ${result.winner === 'X' ? '❌' : '⭕'}!`;
        scores[result.winner]++;
        
        // Подсветка выигрышной линии
        result.cells.forEach(index => {
            document.querySelector(`.cell[data-index="${index}"]`).classList.add('winner');
        });
    }
    
    updateScores();
}

// ====== ИИ ======
function startAIGame() {
    isAIGame = true;
    resetGame();
}

function makeAIMove() {
    if (!gameActive || !isAIGame || currentPlayer !== 'O') return;
    
    const availableMoves = gameBoard
        .map((cell, index) => cell === '' ? index : null)
        .filter(index => index !== null);
    
    if (availableMoves.length > 0) {
        const randomIndex = availableMoves[Math.floor(Math.random() * availableMoves.length)];
        makeMove(randomIndex);
    }
}

// ====== ОНЛАЙН-РЕЖИМ ======
async function createRoom() {
    try {
        const name = elements.onlineName.value || 'Неоновый воин';
        const response = await fetch(BACKEND_BASE + '/create', { method: 'POST' });
        const data = await response.json();
        
        roomCode = data.code;
        elements.roomCode.value = roomCode;
        elements.createPanel.classList.remove('hidden');
        elements.joinPanel.classList.add('hidden');
        
        connectWebSocket(roomCode, name);
        
    } catch (error) {
        showMessage('Ошибка создания комнаты');
    }
}

function showJoinPanel() {
    elements.joinPanel.classList.toggle('hidden');
    elements.createPanel.classList.add('hidden');
}

function joinRoom() {
    const code = elements.joinCodeInput.value.trim().toUpperCase();
    if (!code) {
        elements.joinMsg.textContent = 'Введите код комнаты';
        return;
    }
    
    const name = elements.onlineName.value || 'Неоновый воин';
    elements.joinMsg.textContent = 'Соединяюсь...';
    connectWebSocket(code, name);
}

function connectWebSocket(code, name) {
    const backendHost = BACKEND_BASE.replace(/^https?:\/\//, '');
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${backendHost}/ws/${code}?name=${encodeURIComponent(name)}`;
    
    wsConnection = new WebSocket(wsUrl);
    
    wsConnection.onopen = () => {
        elements.onlineInfo.textContent = 'Подключено, ожидаем соперника...';
    };
    
    wsConnection.onmessage = (event) => {
        try {
            const message = JSON.parse(event.data);
            handleWebSocketMessage(message);
        } catch (error) {
            console.error('Ошибка парсинга сообщения:', error);
        }
    };
    
    wsConnection.onclose = () => {
        elements.onlineInfo.textContent = 'Отключено';
        gameActive = false;
        stopTimer();
    };
    
    wsConnection.onerror = (error) => {
        elements.onlineInfo.textContent = 'Ошибка подключения';
    };
}

function handleWebSocketMessage(message) {
    console.log('Получено сообщение:', message);
    
    switch (message.type) {
        case 'waiting':
            elements.onlineInfo.textContent = 'Ожидаем соперника...';
            mySymbol = message.your_symbol;
            break;
            
        case 'ready':
            gameActive = true;
            mySymbol = message.your_symbol;
            opponentName = message.opponent;
            elements.opponentNameDisplay.textContent = opponentName;
            elements.onlineInfo.textContent = `Игра началась! Вы играете за ${mySymbol}`;
            updateStatus();
            break;
            
        case 'state':
            gameBoard = message.board;
            currentPlayer = message.turn;
            updateBoard();
            updateStatus();
            
            if (message.winner) {
                handleGameEnd({ winner: message.winner });
            } else {
                gameActive = true;
            }
            break;
            
        case 'chat':
            addChatMessage(message.sender, message.message, false);
            break;
            
        case 'error':
            showMessage(message.msg);
            break;
    }
}

// ====== ЧАТ ======
function sendChat() {
    const message = elements.chatInput.value.trim();
    if (!message || !wsConnection) return;
    
    wsConnection.send(JSON.stringify({ type: 'chat', message }));
    addChatMessage('Вы', message, true);
    elements.chatInput.value = '';
}

function addChatMessage(sender, message, isOwnMessage) {
    const messageEl = document.createElement('div');
    const senderColor = isOwnMessage ? '#00ffff' : '#ff00ff';
    messageEl.innerHTML = `<strong style="color: ${senderColor}">${sender}:</strong> ${message}`;
    messageEl.style.marginBottom = '5px';
    elements.chatMessages.appendChild(messageEl);
    elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
}

function clearChat() {
    elements.chatMessages.innerHTML = '';
}

// ====== ТАЙМЕР ======
function startTimer() {
    stopTimer();
    timeLeft = 30;
    updateTimer();
    
    gameTimer = setInterval(() => {
        timeLeft--;
        updateTimer();
        
        if (timeLeft <= 0) {
            stopTimer();
        }
    }, 1000);
}

function stopTimer() {
    if (gameTimer) {
        clearInterval(gameTimer);
        gameTimer = null;
    }
}

// ====== ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ======
function updateBoard() {
    const cells = document.querySelectorAll('.cell');
    cells.forEach((cell, index) => {
        cell.textContent = gameBoard[index] ? (gameBoard[index] === 'X' ? '❌' : '⭕') : '';
        cell.className = 'cell';
        if (gameBoard[index] === 'X') cell.classList.add('x');
        if (gameBoard[index] === 'O') cell.classList.add('o');
    });
}

function updateStatus() {
    elements.status.textContent = `Ход: ${currentPlayer === 'X' ? '❌' : '⭕'}`;
}

function updateTimer() {
    elements.timer.textContent = timeLeft;
}

function updateScores() {
    elements.scoreX.textContent = scores.X;
    elements.scoreO.textContent = scores.O;
    elements.scoreT.textContent = scores.T;
}

function updateDisplay() {
    const name = currentMode === 'local' ? 
        elements.localName.value : elements.onlineName.value;
    elements.myNameDisplay.textContent = name || 'Неоновый воин';
}

function copyRoomCode() {
    navigator.clipboard.writeText(roomCode).then(() => {
        elements.copyCode.textContent = '✅ Скопировано!';
        setTimeout(() => {
            elements.copyCode.textContent = '📋 Скопировать код';
        }, 2000);
    });
}

function showMessage(message) {
    elements.onlineInfo.textContent = message;
    setTimeout(() => {
        if (elements.onlineInfo.textContent === message) {
            elements.onlineInfo.textContent = '';
        }
    }, 3000);
}

// ====== ЗАПУСК ИГРЫ ======
document.addEventListener('DOMContentLoaded', initGame);
</script>
</body>
</html>
