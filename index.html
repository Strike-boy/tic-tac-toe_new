<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEON Tic-Tac-Toe</title>
<style>
  :root {
    --neon-pink: #ff00ff;
    --neon-blue: #00ffff;
    --neon-green: #39ff14;
    --neon-purple: #bf00ff;
    --dark-bg: #0a0a1a;
    --darker-bg: #050510;
    --glass: rgba(255, 255, 255, 0.05);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: var(--darker-bg);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(255, 0, 255, 0.1) 0%, transparent 20%),
      radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.1) 0%, transparent 20%),
      radial-gradient(circle at 50% 80%, rgba(57, 255, 20, 0.1) 0%, transparent 20%);
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 1000px;
    background: var(--glass);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 
      0 0 50px rgba(255, 0, 255, 0.2),
      0 0 75px rgba(0, 255, 255, 0.2),
      inset 0 0 50px rgba(0, 0, 0, 0.3);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .title {
    font-size: 2.2rem;
    font-weight: 800;
    background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue), var(--neon-green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
  }

  .subtitle {
    font-size: 1rem;
    opacity: 0.8;
    margin-top: 5px;
  }

  .controls {
    display: flex;
    gap: 12px;
  }

  .btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: white;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: translateY(-2px);
    box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
  }

  .btn.neon-pink {
    background: linear-gradient(45deg, rgba(255, 0, 255, 0.2), rgba(191, 0, 255, 0.2));
    border: 1px solid var(--neon-pink);
    box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
  }

  .btn.neon-blue {
    background: linear-gradient(45deg, rgba(0, 255, 255, 0.2), rgba(0, 191, 255, 0.2));
    border: 1px solid var(--neon-blue);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 25px;
  }

  .game-section {
    background: rgba(0, 0, 0, 0.2);
    padding: 20px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .game-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .mode-badge {
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    font-weight: 600;
  }

  .player-info {
    text-align: right;
  }

  .timer {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--neon-green);
    text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 20px 0;
  }

  .cell {
    aspect-ratio: 1;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .cell:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .cell.x {
    color: var(--neon-pink);
    text-shadow: 0 0 15px var(--neon-pink);
  }

  .cell.o {
    color: var(--neon-blue);
    text-shadow: 0 0 15px var(--neon-blue);
  }

  .cell.winner {
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .cell::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transition: left 0.5s;
  }

  .cell:hover::before {
    left: 100%;
  }

  .status {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 600;
    margin: 15px 0;
    color: var(--neon-green);
    text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
  }

  .score-board {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 15px;
  }

  .score-item {
    text-align: center;
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .score-value {
    font-size: 1.5rem;
    font-weight: 700;
  }

  .score-x { color: var(--neon-pink); }
  .score-o { color: var(--neon-blue); }
  .score-t { color: var(--neon-green); }

  .menu-section {
    background: rgba(0, 0, 0, 0.2);
    padding: 20px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .mode-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .mode-btn {
    flex: 1;
    text-align: center;
    padding: 15px;
  }

  .panel {
    margin-top: 20px;
  }

  .input-group {
    margin-bottom: 15px;
  }

  .input-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
    color: var(--neon-blue);
  }

  .input-group input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: white;
    font-size: 1rem;
  }

  .input-group input:focus {
    outline: none;
    border-color: var(--neon-blue);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }

  .action-buttons {
    display: flex;
    gap: 10px;
    margin: 15px 0;
  }

  .action-btn {
    flex: 1;
    text-align: center;
  }

  .chat-container {
    margin-top: 25px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 15px;
  }

  .chat-messages {
    height: 150px;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .chat-input {
    display: flex;
    gap: 10px;
  }

  .chat-input input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: white;
  }

  .hidden {
    display: none;
  }

  .online-status {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    text-align: center;
  }

  /* Анимации */
  @keyframes appear {
    from {
      opacity: 0;
      transform: scale(0.8);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .cell.x, .cell.o {
    animation: appear 0.3s ease-out;
  }

  /* Адаптивность */
  @media (max-width: 900px) {
    .main-grid {
      grid-template-columns: 1fr;
    }
    
    .header {
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }
    
    .title {
      font-size: 1.8rem;
    }
  }

  /* Стили для победной линии */
  .win-line {
    position: absolute;
    background: var(--neon-green);
    box-shadow: 0 0 10px var(--neon-green);
    z-index: 1;
  }

  /* Эмодзи реакции */
  .emoji-reaction {
    position: absolute;
    font-size: 2rem;
    animation: floatUp 2s ease-out;
    z-index: 100;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(0);
      opacity: 0;
    }
    50% {
      opacity: 1;
      transform: translateY(-50px) scale(1.2);
    }
    100% {
      transform: translateY(-100px) scale(0.8);
      opacity: 0;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <div class="title">NEON TIC-TAC-TOE</div>
        <div class="subtitle">Игра будущего уже здесь</div>
      </div>
      <div class="controls">
        <button class="btn neon-pink" id="resetAll">🔄 Новая игра</button>
        <button class="btn neon-blue" id="restartBtn">⚡ Рестарт</button>
      </div>
    </div>

    <div class="main-grid">
      <!-- Левая секция - игровое поле -->
      <div class="game-section">
        <div class="game-info">
          <div class="mode-badge" id="modeLabel">Локально</div>
          <div class="player-info">
            <div>Вы: <strong id="myNameDisplay">Гость</strong></div>
            <div>Соперник: <strong id="opponentNameDisplay">—</strong></div>
          </div>
        </div>

        <div class="timer" id="timer">30</div>
        
        <div class="board" id="board">
          <div class="cell" data-index="0"></div>
          <div class="cell" data-index="1"></div>
          <div class="cell" data-index="2"></div>
          <div class="cell" data-index="3"></div>
          <div class="cell" data-index="4"></div>
          <div class="cell" data-index="5"></div>
          <div class="cell" data-index="6"></div>
          <div class="cell" data-index="7"></div>
          <div class="cell" data-index="8"></div>
        </div>

        <div class="status" id="status">Ход: ❌</div>
        
        <div class="score-board">
          <div class="score-item">
            <div>❌</div>
            <div class="score-value score-x" id="scoreX">0</div>
          </div>
          <div class="score-item">
            <div>🤝</div>
            <div class="score-value score-t" id="scoreT">0</div>
          </div>
          <div class="score-item">
            <div>⭕</div>
            <div class="score-value score-o" id="scoreO">0</div>
          </div>
        </div>
      </div>

      <!-- Правая секция - меню -->
      <div class="menu-section">
        <div class="mode-selector">
          <button class="btn mode-btn" id="btnLocal">🎮 Локально</button>
          <button class="btn mode-btn" id="btnOnline">🌐 Онлайн</button>
        </div>

        <div id="localPanel">
          <div class="input-group">
            <label>Ваш никнейм</label>
            <input id="localName" type="text" placeholder="Неоновый воин" />
          </div>
          
          <div class="action-buttons">
            <button class="btn action-btn" id="btnVsAI">🤖 Играть с ИИ</button>
          </div>
        </div>

        <div id="onlinePanel" class="hidden">
          <div class="input-group">
            <label>Твой никнейм</label>
            <input id="onlineName" type="text" placeholder="Неоновый воин" />
          </div>

          <div class="action-buttons">
            <button class="btn neon-pink action-btn" id="createBtn">➕ Создать комнату</button>
            <button class="btn neon-blue action-btn" id="joinBtn">🔗 Присоединиться</button>
          </div>

          <div id="createPanel" class="hidden">
            <div class="input-group">
              <label>Код комнаты</label>
              <input id="roomCode" type="text" readonly />
            </div>
            <button class="btn action-btn" id="copyCode">📋 Скопировать код</button>
          </div>

          <div id="joinPanel" class="hidden">
            <div class="input-group">
              <label>Введите код комнаты</label>
              <input id="joinCodeInput" type="text" placeholder="ABCD" />
            </div>
            <button class="btn action-btn" id="joinRoomBtn">🚀 Войти</button>
            <div id="joinMsg" class="online-status"></div>
          </div>

          <div id="onlineInfo" class="online-status">Отключено</div>

          <!-- Чат -->
          <div class="chat-container">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
              <input type="text" id="chatInput" placeholder="Сообщение..." />
              <button class="btn" id="sendChatBtn">📨</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Здесь будет JavaScript код...
    // (Полный JS код из предыдущей версии с добавлением новых функций)
  </script>
</body>
</html>
