<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEON Tic-Tac-Toe</title>
<style>
  :root {
    --neon-pink: #ff00ff;
    --neon-blue: #00ffff;
    --neon-green: #39ff14;
    --neon-purple: #bf00ff;
    --dark-bg: #0a0a1a;
    --darker-bg: #050510;
    --glass: rgba(255, 255, 255, 0.05);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: var(--darker-bg);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(255, 0, 255, 0.1) 0%, transparent 20%),
      radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.1) 0%, transparent 20%),
      radial-gradient(circle at 50% 80%, rgba(57, 255, 20, 0.1) 0%, transparent 20%);
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 1000px;
    background: var(--glass);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 
      0 0 50px rgba(255, 0, 255, 0.2),
      0 0 75px rgba(0, 255, 255, 0.2),
      inset 0 0 50px rgba(0, 0, 0, 0.3);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .title {
    font-size: 2.2rem;
    font-weight: 800;
    background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue), var(--neon-green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
  }

  .subtitle {
    font-size: 1rem;
    opacity: 0.8;
    margin-top: 5px;
  }

  .controls {
    display: flex;
    gap: 12px;
  }

  .btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: white;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: translateY(-2px);
    box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
  }

  .btn.neon-pink {
    background: linear-gradient(45deg, rgba(255, 0, 255, 0.2), rgba(191, 0, 255, 0.2));
    border: 1px solid var(--neon-pink);
    box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
  }

  .btn.neon-blue {
    background: linear-gradient(45deg, rgba(0, 255, 255, 0.2), rgba(0, 191, 255, 0.2));
    border: 1px solid var(--neon-blue);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 25px;
  }

  .game-section {
    background: rgba(0, 0, 0, 0.2);
    padding: 20px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .game-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .mode-badge {
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    font-weight: 600;
  }

  .player-info {
    text-align: right;
  }

  .timer {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--neon-green);
    text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 20px 0;
  }

  .cell {
    aspect-ratio: 1;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .cell:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .cell.x {
    color: var(--neon-pink);
    text-shadow: 0 0 15px var(--neon-pink);
  }

  .cell.o {
    color: var(--neon-blue);
    text-shadow: 0 0 15px var(--neon-blue);
  }

  .cell.winner {
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .cell::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transition: left 0.5s;
  }

  .cell:hover::before {
    left: 100%;
  }

  .status {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 600;
    margin: 15px 0;
    color: var(--neon-green);
    text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
  }

  .score-board {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 15px;
  }

  .score-item {
    text-align: center;
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .score-value {
    font-size: 1.5rem;
    font-weight: 700;
  }

  .score-x { color: var(--neon-pink); }
  .score-o { color: var(--neon-blue); }
  .score-t { color: var(--neon-green); }

  .menu-section {
    background: rgba(0, 0, 0, 0.2);
    padding: 20px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .mode-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .mode-btn {
    flex: 1;
    text-align: center;
    padding: 15px;
  }

  .panel {
    margin-top: 20px;
  }

  .input-group {
    margin-bottom: 15px;
  }

  .input-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
    color: var(--neon-blue);
  }

  .input-group input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: white;
    font-size: 1rem;
  }

  .input-group input:focus {
    outline: none;
    border-color: var(--neon-blue);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }

  .action-buttons {
    display: flex;
    gap: 10px;
    margin: 15px 0;
  }

  .action-btn {
    flex: 1;
    text-align: center;
  }

  .chat-container {
    margin-top: 25px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 15px;
  }

  .chat-messages {
    height: 150px;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .chat-input {
    display: flex;
    gap: 10px;
  }

  .chat-input input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: white;
  }

  .hidden {
    display: none;
  }

  .online-status {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    text-align: center;
  }

  /* Анимации */
  @keyframes appear {
    from {
      opacity: 0;
      transform: scale(0.8);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .cell.x, .cell.o {
    animation: appear 0.3s ease-out;
  }

  /* Адаптивность */
  @media (max-width: 900px) {
    .main-grid {
      grid-template-columns: 1fr;
    }
    
    .header {
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }
    
    .title {
      font-size: 1.8rem;
    }
  }

  /* Стили для победной линии */
  .win-line {
    position: absolute;
    background: var(--neon-green);
    box-shadow: 0 0 10px var(--neon-green);
    z-index: 1;
  }

  /* Эмодзи реакции */
  .emoji-reaction {
    position: absolute;
    font-size: 2rem;
    animation: floatUp 2s ease-out;
    z-index: 100;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(0);
      opacity: 0;
    }
    50% {
      opacity: 1;
      transform: translateY(-50px) scale(1.2);
    }
    100% {
      transform: translateY(-100px) scale(0.8);
      opacity: 0;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <div class="title">NEON TIC-TAC-TOE</div>
        <div class="subtitle">Игра будущего уже здесь</div>
      </div>
      <div class="controls">
        <button class="btn neon-pink" id="resetAll">🔄 Новая игра</button>
        <button class="btn neon-blue" id="restartBtn">⚡ Рестарт</button>
      </div>
    </div>

    <div class="main-grid">
      <!-- Левая секция - игровое поле -->
      <div class="game-section">
        <div class="game-info">
          <div class="mode-badge" id="modeLabel">Локально</div>
          <div class="player-info">
            <div>Вы: <strong id="myNameDisplay">Гость</strong></div>
            <div>Соперник: <strong id="opponentNameDisplay">—</strong></div>
          </div>
        </div>

        <div class="timer" id="timer">30</div>
        
        <div class="board" id="board">
          <div class="cell" data-index="0"></div>
          <div class="cell" data-index="1"></div>
          <div class="cell" data-index="2"></div>
          <div class="cell" data-index="3"></div>
          <div class="cell" data-index="4"></div>
          <div class="cell" data-index="5"></div>
          <div class="cell" data-index="6"></div>
          <div class="cell" data-index="7"></div>
          <div class="cell" data-index="8"></div>
        </div>

        <div class="status" id="status">Ход: ❌</div>
        
        <div class="score-board">
          <div class="score-item">
            <div>❌</div>
            <div class="score-value score-x" id="scoreX">0</div>
          </div>
          <div class="score-item">
            <div>🤝</div>
            <div class="score-value score-t" id="scoreT">0</div>
          </div>
          <div class="score-item">
            <div>⭕</div>
            <div class="score-value score-o" id="scoreO">0</div>
          </div>
        </div>
      </div>

      <!-- Правая секция - меню -->
      <div class="menu-section">
        <div class="mode-selector">
          <button class="btn mode-btn" id="btnLocal">🎮 Локально</button>
          <button class="btn mode-btn" id="btnOnline">🌐 Онлайн</button>
        </div>

        <div id="localPanel">
          <div class="input-group">
            <label>Ваш никнейм</label>
            <input id="localName" type="text" placeholder="Неоновый воин" />
          </div>
          
          <div class="action-buttons">
            <button class="btn action-btn" id="btnVsAI">🤖 Играть с ИИ</button>
          </div>
        </div>

        <div id="onlinePanel" class="hidden">
          <div class="input-group">
            <label>Твой никнейм</label>
            <input id="onlineName" type="text" placeholder="Неоновый воин" />
          </div>

          <div class="action-buttons">
            <button class="btn neon-pink action-btn" id="createBtn">➕ Создать комнату</button>
            <button class="btn neon-blue action-btn" id="joinBtn">🔗 Присоединиться</button>
          </div>

          <div id="createPanel" class="hidden">
            <div class="input-group">
              <label>Код комнаты</label>
              <input id="roomCode" type="text" readonly />
            </div>
            <button class="btn action-btn" id="copyCode">📋 Скопировать код</button>
          </div>

          <div id="joinPanel" class="hidden">
            <div class="input-group">
              <label>Введите код комнаты</label>
              <input id="joinCodeInput" type="text" placeholder="ABCD" />
            </div>
            <button class="btn action-btn" id="joinRoomBtn">🚀 Войти</button>
            <div id="joinMsg" class="online-status"></div>
          </div>

          <div id="onlineInfo" class="online-status">Отключено</div>

          <!-- Чат -->
          <div class="chat-container">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
              <input type="text" id="chatInput" placeholder="Сообщение..." />
              <button class="btn" id="sendChatBtn">📨</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/* ====== НАСТРОЙКИ ====== */
const BACKEND_BASE = "https://tic-tac-toe-site.onrender.com"; // ЗАМЕНИ НА СВОЙ URL

/* ====== UI Elements ====== */
const elements = {
    board: document.getElementById('board'),
    status: document.getElementById('status'),
    timer: document.getElementById('timer'),
    modeLabel: document.getElementById('modeLabel'),
    btnLocal: document.getElementById('btnLocal'),
    btnOnline: document.getElementById('btnOnline'),
    localPanel: document.getElementById('localPanel'),
    onlinePanel: document.getElementById('onlinePanel'),
    createBtn: document.getElementById('createBtn'),
    joinBtn: document.getElementById('joinBtn'),
    createPanel: document.getElementById('createPanel'),
    joinPanel: document.getElementById('joinPanel'),
    roomCode: document.getElementById('roomCode'),
    copyCode: document.getElementById('copyCode'),
    joinCodeInput: document.getElementById('joinCodeInput'),
    joinRoomBtn: document.getElementById('joinRoomBtn'),
    joinMsg: document.getElementById('joinMsg'),
    onlineInfo: document.getElementById('onlineInfo'),
    myNameDisplay: document.getElementById('myNameDisplay'),
    opponentNameDisplay: document.getElementById('opponentNameDisplay'),
    localName: document.getElementById('localName'),
    onlineName: document.getElementById('onlineName'),
    resetAll: document.getElementById('resetAll'),
    restartBtn: document.getElementById('restartBtn'),
    scoreX: document.getElementById('scoreX'),
    scoreO: document.getElementById('scoreO'),
    scoreT: document.getElementById('scoreT'),
    btnVsAI: document.getElementById('btnVsAI'),
    chatMessages: document.getElementById('chatMessages'),
    chatInput: document.getElementById('chatInput'),
    sendChatBtn: document.getElementById('sendChatBtn')
};

/* ====== Game State ====== */
let gameState = {
    mode: 'local',
    localGame: { board: Array(9).fill(''), turn: 'X', active: true },
    online: { 
        ws: null, code: null, mySymbol: null, 
        board: Array(9).fill(''), turn: 'X', 
        active: false, opponent: null, 
        timer: null, timeLeft: 30 
    },
    scores: { X: 0, O: 0, T: 0 },
    isPlayingWithAI: false
};

/* ====== Initialize Game ====== */
function initGame() {
    console.log("Initializing game...");
    
    // Add event listeners
    elements.btnLocal.addEventListener('click', () => setMode('local'));
    elements.btnOnline.addEventListener('click', () => setMode('online'));
    elements.createBtn.addEventListener('click', createRoom);
    elements.joinBtn.addEventListener('click', toggleJoinPanel);
    elements.joinRoomBtn.addEventListener('click', joinRoom);
    elements.copyCode.addEventListener('click', copyRoomCode);
    elements.resetAll.addEventListener('click', resetAll);
    elements.restartBtn.addEventListener('click', restartGame);
    elements.btnVsAI.addEventListener('click', startVsAI);
    elements.sendChatBtn.addEventListener('click', sendChat);
    elements.chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendChat();
    });

    // Add cell click listeners
    const cells = document.querySelectorAll('.cell');
    cells.forEach((cell, index) => {
        cell.addEventListener('click', () => onCellClick(index));
    });

    // Initialize UI
    setMode('local');
    resetBoard();
    updateScores();
    
    console.log("Game initialized successfully!");
}

/* ====== Core Game Functions ====== */
function setMode(mode) {
    gameState.mode = mode;
    elements.modeLabel.textContent = mode === 'local' ? 'Локально' : 'Онлайн';
    elements.localPanel.classList.toggle('hidden', mode !== 'local');
    elements.onlinePanel.classList.toggle('hidden', mode !== 'online');
    resetBoard();
}

function resetBoard() {
    gameState.localGame.board = Array(9).fill('');
    gameState.localGame.turn = 'X';
    gameState.localGame.active = true;
    
    gameState.online.active = false;
    elements.onlineInfo.textContent = '';
    elements.roomCode.value = '';
    elements.createPanel.classList.add('hidden');
    elements.joinPanel.classList.add('hidden');
    elements.joinMsg.textContent = '';
    stopTimer();
    
    const playerName = gameState.mode === 'local' ? 
        (elements.localName.value || 'Неоновый воин') : 
        (elements.onlineName.value || 'Неоновый воин');
    
    elements.myNameDisplay.textContent = playerName;
    
    // Clear board
    const cells = document.querySelectorAll('.cell');
    cells.forEach((cell, i) => {
        cell.textContent = '';
        cell.className = 'cell';
        cell.dataset.index = i;
    });
    
    elements.status.textContent = `Ход: ${gameState.localGame.turn === 'X' ? '❌' : '⭕'}`;
    elements.timer.textContent = '30';
}

function onCellClick(index) {
    console.log("Cell clicked:", index);
    
    if (gameState.mode === 'local') {
        handleLocalMove(index);
    } else {
        handleOnlineMove(index);
    }
}

function handleLocalMove(index) {
    if (!gameState.localGame.active) return;
    if (gameState.localGame.board[index]) return;
    
    gameState.localGame.board[index] = gameState.localGame.turn;
    renderBoard();
    
    const result = checkWin(gameState.localGame.board);
    if (result && result.winner) {
        gameState.localGame.active = false;
        handleGameEnd(result);
    } else {
        gameState.localGame.turn = gameState.localGame.turn === 'X' ? 'O' : 'X';
        elements.status.textContent = `Ход: ${gameState.localGame.turn === 'X' ? '❌' : '⭕'}`;
        
        if (gameState.isPlayingWithAI && gameState.localGame.turn === 'O') {
            setTimeout(() => makeAIMove(), 500);
        }
    }
}

function handleOnlineMove(index) {
    if (!gameState.online.active) {
        alert('Сначала создай или присоединись к комнате.');
        return;
    }
    if (gameState.online.turn !== gameState.online.mySymbol) return;
    if (gameState.online.board[index]) return;
    
    const msg = { type: 'move', index: index };
    gameState.online.ws.send(JSON.stringify(msg));
    stopTimer();
}

/* ====== AI Functions ====== */
function startVsAI() {
    gameState.isPlayingWithAI = true;
    resetBoard();
    const name = elements.localName.value || 'Неоновый воин';
    elements.myNameDisplay.textContent = name;
    elements.opponentNameDisplay.textContent = '🤖 ИИ';
}

function makeAIMove() {
    if (!gameState.localGame.active || !gameState.isPlayingWithAI || gameState.localGame.turn !== 'O') return;
    
    const emptyCells = gameState.localGame.board
        .map((cell, index) => cell === '' ? index : null)
        .filter(index => index !== null);
    
    if (emptyCells.length > 0) {
        const randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        onCellClick(randomIndex);
    }
}

/* ====== Online Functions ====== */
async function createRoom() {
    const name = elements.onlineName.value.trim() || 'Неоновый воин';
    const code = await apiCreate();
    if (!code) return;
    
    elements.roomCode.value = code;
    connectWS(code, name);
    elements.createPanel.classList.remove('hidden');
    elements.joinPanel.classList.add('hidden');
}

async function apiCreate() {
    try {
        const response = await fetch(BACKEND_BASE + '/create', { method: 'POST' });
        const data = await response.json();
        return data.code;
    } catch (error) {
        console.error('Create error:', error);
        alert('Ошибка создания комнаты');
        return null;
    }
}

function connectWS(code, name) {
    const backendHost = BACKEND_BASE.replace(/^https?:\/\//, '');
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = `${protocol}//${backendHost}/ws/${code}?name=${encodeURIComponent(name)}`;
    
    gameState.online.ws = new WebSocket(wsUrl);
    gameState.online.code = code;
    elements.onlineInfo.textContent = 'Соединяюсь...';
    
    gameState.online.ws.onopen = () => {
        elements.onlineInfo.textContent = 'Ожидание соперника...';
    };
    
    gameState.online.ws.onmessage = (event) => {
        try {
            const message = JSON.parse(event.data);
            handleOnlineMessage(message);
        } catch (error) {
            console.error('Message parse error:', error);
        }
    };
    
    gameState.online.ws.onclose = () => {
        elements.onlineInfo.textContent = 'Соединение закрыто';
        gameState.online.active = false;
        stopTimer();
    };
    
    gameState.online.ws.onerror = (error) => {
        console.error('WebSocket error:', error);
        elements.onlineInfo.textContent = 'Ошибка соединения';
    };
}

function handleOnlineMessage(msg) {
    console.log("Received message:", msg);
    
    switch (msg.type) {
        case 'ready':
            gameState.online.active = true;
            gameState.online.board = msg.board || Array(9).fill('');
            gameState.online.turn = msg.turn || 'X';
            gameState.online.mySymbol = msg.your_symbol;
            gameState.online.opponent = msg.opponent;
            
            elements.myNameDisplay.textContent = elements.onlineName.value || 'Игрок';
            elements.opponentNameDisplay.textContent = gameState.online.opponent || '—';
            elements.onlineInfo.textContent = `Игра началась! Ты играешь ${gameState.online.mySymbol}`;
            
            renderBoard();
            elements.status.textContent = `Ход: ${gameState.online.turn === 'X' ? '❌' : '⭕'}`;
            break;
            
        case 'state':
            gameState.online.board = msg.board || Array(9).fill('');
            gameState.online.turn = msg.turn || 'X';
            renderBoard();
            
            if (msg.winner) {
                handleGameEnd(msg);
                gameState.online.active = false;
                stopTimer();
            } else {
                elements.status.textContent = `Ход: ${msg.turn === 'X' ? '❌' : '⭕'}`;
            }
            break;
            
        case 'error':
            alert(msg.msg);
            break;
            
        case 'chat':
            addChatMessage(msg.sender, msg.message);
            break;
    }
}

/* ====== Helper Functions ====== */
function checkWin(board) {
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    
    for (const [a, b, c] of wins) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            return { winner: board[a], combo: [a, b, c] };
        }
    }
    
    if (!board.includes('')) return { winner: 'D', combo: [] };
    return null;
}

function renderBoard() {
    const board = gameState.mode === 'local' ? gameState.localGame.board : gameState.online.board;
    const cells = document.querySelectorAll('.cell');
    
    board.forEach((value, i) => {
        cells[i].textContent = value ? (value === 'X' ? '❌' : '⭕') : '';
        cells[i].className = 'cell';
        if (value === 'X') cells[i].classList.add('x');
        if (value === 'O') cells[i].classList.add('o');
    });
}

function handleGameEnd(result) {
    if (result.winner === 'D') {
        elements.status.textContent = 'Ничья 🤝';
        gameState.scores.T++;
    } else {
        elements.status.textContent = `Победил ${result.winner === 'X' ? '❌' : '⭕'}!`;
        gameState.scores[result.winner]++;
    }
    updateScores();
}

function updateScores() {
    elements.scoreX.textContent = gameState.scores.X;
    elements.scoreO.textContent = gameState.scores.O;
    elements.scoreT.textContent = gameState.scores.T;
}

function toggleJoinPanel() {
    elements.joinPanel.classList.toggle('hidden');
    elements.createPanel.classList.add('hidden');
}

function joinRoom() {
    const code = elements.joinCodeInput.value.trim().toUpperCase();
    if (!code) {
        elements.joinMsg.textContent = 'Введите код комнаты';
        return;
    }
    
    const name = elements.onlineName.value.trim() || 'Неоновый воин';
    elements.joinMsg.textContent = 'Соединяюсь...';
    connectWS(code, name);
}

function copyRoomCode() {
    navigator.clipboard.writeText(elements.roomCode.value)
        .then(() => {
            elements.copyCode.textContent = '✅ Скопировано!';
            setTimeout(() => {
                elements.copyCode.textContent = '📋 Скопировать код';
            }, 2000);
        });
}

function resetAll() {
    gameState.scores = { X: 0, O: 0, T: 0 };
    updateScores();
    resetBoard();
    gameState.isPlayingWithAI = false;
    
    if (gameState.mode === 'online' && gameState.online.ws) {
        gameState.online.ws.close();
        gameState.online.ws = null;
    }
}

function restartGame() {
    if (gameState.mode === 'local') {
        resetBoard();
    } else if (gameState.mode === 'online' && gameState.online.ws) {
        gameState.online.ws.send(JSON.stringify({ type: 'rematch' }));
    }
}

function addChatMessage(sender, message) {
    const messageEl = document.createElement('div');
    messageEl.innerHTML = `<strong>${sender}:</strong> ${message}`;
    messageEl.style.marginBottom = '5px';
    elements.chatMessages.appendChild(messageEl);
    elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
}

function sendChat() {
    const message = elements.chatInput.value.trim();
    if (message && gameState.online.ws) {
        gameState.online.ws.send(JSON.stringify({ type: 'chat', message }));
        addChatMessage('Вы', message);
        elements.chatInput.value = '';
    }
}

function startTimer() {
    stopTimer();
    gameState.online.timeLeft = 30;
    elements.timer.textContent = gameState.online.timeLeft;
    
    gameState.online.timer = setInterval(() => {
        gameState.online.timeLeft--;
        elements.timer.textContent = gameState.online.timeLeft;
        
        if (gameState.online.timeLeft <= 0) {
            stopTimer();
        }
    }, 1000);
}

function stopTimer() {
    if (gameState.online.timer) {
        clearInterval(gameState.online.timer);
        gameState.online.timer = null;
    }
}

/* ====== Start the Game ====== */
document.addEventListener('DOMContentLoaded', initGame);
</script>
</body>
</html>
