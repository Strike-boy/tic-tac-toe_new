<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON Tic-Tac-Toe Pro</title>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-green: #39ff14;
            --neon-purple: #bf00ff;
            --dark-bg: #0a0a1a;
            --darker-bg: #050510;
            --glass: rgba(255, 255, 255, 0.05);
            --card-bg: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--darker-bg);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 255, 0.1) 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.1) 0%, transparent 25%),
                radial-gradient(circle at 40% 80%, rgba(57, 255, 20, 0.1) 0%, transparent 25%);
            z-index: -1;
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 0 50px rgba(255, 0, 255, 0.2),
                0 0 100px rgba(0, 255, 255, 0.1);
        }

        h1, h2 {
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
        }

        h2 {
            font-size: 1.8rem;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 0, 255, 0.3);
        }

        .btn.neon-pink {
            background: linear-gradient(45deg, rgba(255, 0, 255, 0.2), rgba(191, 0, 255, 0.2));
            border: 1px solid var(--neon-pink);
        }

        .btn.neon-blue {
            background: linear-gradient(45deg, rgba(0, 255, 255, 0.2), rgba(0, 191, 255, 0.2));
            border: 1px solid var(--neon-blue);
        }

        .btn.neon-green {
            background: linear-gradient(45deg, rgba(57, 255, 20, 0.2), rgba(20, 200, 20, 0.2));
            border: 1px solid var(--neon-green);
        }

        .btn-back {
            width: auto;
            padding: 10px 20px;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .board {
            display: grid;
            gap: 8px;
            margin: 20px 0;
            justify-content: center;
        }

        .board-3x3 { grid-template-columns: repeat(3, 80px); }
        .board-4x4 { grid-template-columns: repeat(4, 70px); }
        .board-5x5 { grid-template-columns: repeat(5, 60px); }

        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .cell.x {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .cell.o {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .cell.winner {
            animation: pulse 1s infinite;
            background: rgba(57, 255, 20, 0.1);
        }

        .game-info {
            text-align: center;
            margin: 15px 0;
        }

        .status {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--neon-green);
            margin-bottom: 10px;
        }

        .timer {
            font-size: 1.1rem;
            color: var(--neon-blue);
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }

        .score-item {
            text-align: center;
            padding: 10px;
        }

        .score-value {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .chat-container {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }

        .chat-messages {
            height: 100px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .quick-reactions {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }

        .reaction-btn {
            flex: 1;
            padding: 5px;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            cursor: pointer;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .settings-group {
            margin: 15px 0;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--neon-green);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes confetti {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            pointer-events: none;
            animation: confetti 2s ease-out forwards;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            
            .board-3x3 { grid-template-columns: repeat(3, 70px); }
            .board-4x4 { grid-template-columns: repeat(4, 60px); }
            .board-5x5 { grid-template-columns: repeat(5, 50px); }
            
            .cell {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <!-- Главное меню -->
    <div id="mainMenu" class="screen active">
        <div class="container">
            <h1>NEON TIC-TAC-TOE</h1>
            <button class="btn neon-pink" onclick="showScreen('localMenu')">🎮 Локальная игра</button>
            <button class="btn neon-blue" onclick="showScreen('aiMenu')">🤖 Игра с ИИ</button>
            <button class="btn neon-green" onclick="showScreen('onlineMenu')">🌐 Онлайн матч</button>
            <button class="btn" onclick="showScreen('settings')">⚙️ Настройки</button>
        </div>
    </div>

    <!-- Меню локальной игры -->
    <div id="localMenu" class="screen">
        <div class="container">
            <h2>Локальная игра</h2>
            <button class="btn" onclick="startLocalGame('3x3')">3x3 (Классика)</button>
            <button class="btn" onclick="startLocalGame('4x4')">4x4 (Средний)</button>
            <button class="btn" onclick="startLocalGame('5x5')">5x5 (Сложный)</button>
            <button class="btn btn-back" onclick="showScreen('mainMenu')">← Назад</button>
        </div>
    </div>

    <!-- Меню ИИ -->
    <div id="aiMenu" class="screen">
        <div class="container">
            <h2>Выбери сложность ИИ</h2>
            <button class="btn" onclick="startAIGame('easy', '3x3')">🥉 Легкий (3x3)</button>
            <button class="btn" onclick="startAIGame('medium', '3x3')">🥈 Средний (3x3)</button>
            <button class="btn" onclick="startAIGame('hard', '3x3')">🥇 Сложный (3x3)</button>
            <button class="btn" onclick="startAIGame('medium', '4x4')">🎯 Эксперт (4x4)</button>
            <button class="btn" onclick="startAIGame('hard', '5x5')">🧠 Гений (5x5)</button>
            <button class="btn btn-back" onclick="showScreen('mainMenu')">← Назад</button>
        </div>
    </div>

    <!-- Меню онлайн игры -->
    <div id="onlineMenu" class="screen">
        <div class="container">
            <h2>Онлайн матч</h2>
            <button class="btn neon-pink" onclick="showScreen('createRoom')">➕ Создать комнату</button>
            <button class="btn neon-blue" onclick="showScreen('joinRoom')">🔗 Присоединиться</button>
            <button class="btn btn-back" onclick="showScreen('mainMenu')">← Назад</button>
        </div>
    </div>

    <!-- Создание комнаты -->
    <div id="createRoom" class="screen">
        <div class="container">
            <h2>Создать комнату</h2>
            <div class="setting-item">
                <span>Размер поля:</span>
                <select id="roomSize">
                    <option value="3x3">3x3</option>
                    <option value="4x4">4x4</option>
                    <option value="5x5">5x5</option>
                </select>
            </div>
            <input type="text" id="playerName" placeholder="Твой никнейм" class="btn" style="text-align: center;">
            <button class="btn neon-pink" onclick="createRoom()">Создать</button>
            <div id="roomInfo" class="game-info" style="display: none;">
                <p>Код комнаты: <strong id="roomCode"></strong></p>
                <button class="btn" onclick="copyRoomCode()">📋 Скопировать код</button>
            </div>
            <button class="btn btn-back" onclick="showScreen('onlineMenu')">← Назад</button>
        </div>
    </div>

    <!-- Присоединение к комнате -->
    <div id="joinRoom" class="screen">
        <div class="container">
            <h2>Присоединиться к комнате</h2>
            <input type="text" id="joinPlayerName" placeholder="Твой никнейм" class="btn" style="text-align: center;">
            <input type="text" id="joinCodeInput" placeholder="Код комнаты" class="btn" style="text-align: center;">
            <button class="btn neon-blue" onclick="joinRoom()">Присоединиться</button>
            <div id="joinStatus" class="game-info"></div>
            <button class="btn btn-back" onclick="showScreen('onlineMenu')">← Назад</button>
        </div>
    </div>

    <!-- Настройки -->
    <div id="settings" class="screen">
        <div class="container">
            <h2>Настройки</h2>
            
            <div class="settings-group">
                <h3>Звуки</h3>
                <div class="setting-item">
                    <span>🔊 Звуковые эффекты</span>
                    <label class="switch">
                        <input type="checkbox" id="soundToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="settings-group">
                <h3>Внешний вид</h3>
                <div class="setting-item">
                    <span>Размер поля по умолчанию</span>
                    <select id="defaultBoardSize">
                        <option value="3x3">3x3</option>
                        <option value="4x4">4x4</option>
                        <option value="5x5">5x5</option>
                    </select>
                </div>
            </div>

            <button class="btn btn-back" onclick="showScreen('mainMenu')">← Назад</button>
        </div>
    </div>

    <!-- Игровой экран -->
    <div id="gameScreen" class="screen">
        <div class="container">
            <div class="game-header">
                <button class="btn btn-back" onclick="returnToMenu()">🏠 Меню</button>
                <div id="gameMode"></div>
            </div>

            <div class="game-info">
                <div class="status" id="gameStatus">Ход: ❌</div>
                <div class="timer" id="gameTimer">--</div>
            </div>

            <div class="board" id="gameBoard">
                <!-- Игровое поле генерируется динамически -->
            </div>

            <div class="score-board">
                <div class="score-item">
                    <div>❌</div>
                    <div class="score-value" id="scoreX">0</div>
                </div>
                <div class="score-item">
                    <div>🤝</div>
                    <div class="score-value" id="scoreT">0</div>
                </div>
                <div class="score-item">
                    <div>⭕</div>
                    <div class="score-value" id="scoreO">0</div>
                </div>
            </div>

            <!-- Чат (только для онлайн режима) -->
            <div id="onlineChat" class="chat-container" style="display: none;">
                <div class="quick-reactions">
                    <button class="reaction-btn" onclick="sendReaction('👍')">👍</button>
                    <button class="reaction-btn" onclick="sendReaction('😂')">😂</button>
                    <button class="reaction-btn" onclick="sendReaction('🔥')">🔥</button>
                    <button class="reaction-btn" onclick="sendReaction('🎉')">🎉</button>
                    <button class="reaction-btn" onclick="sendReaction('😢')">😢</button>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Сообщение...">
                    <button class="btn" onclick="sendMessage()">📨</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ====== КОНФИГУРАЦИЯ ======
        const BACKEND_BASE = "https://tic-tac-toe-site.onrender.com";

        // ====== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ======
        let currentGame = {
            mode: null, // 'local', 'ai', 'online'
            boardSize: '3x3',
            board: [],
            currentPlayer: 'X',
            gameActive: false,
            aiDifficulty: null,
            scores: { X: 0, O: 0, T: 0 }
        };

        let onlineGame = {
            ws: null,
            roomCode: '',
            mySymbol: '',
            opponentName: '',
            connected: false
        };

        let soundManager = {
            enabled: true,
            sounds: {},
            init: function() {
                // Создаем звуковые эффекты программно (без файлов)
                this.sounds.click = this.createSound(800, 0.1);
                this.sounds.win = this.createSound(600, 0.3);
                this.sounds.move = this.createSound(400, 0.2);
            },
            createSound: function(freq, duration) {
                return {
                    play: function() {
                        if (!soundManager.enabled) return;
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const oscillator = audioCtx.createOscillator();
                        const gainNode = audioCtx.createGain();
                        
                        oscillator.connect(gainNode);
                        gainNode.connect(audioCtx.destination);
                        
                        oscillator.frequency.value = freq;
                        oscillator.type = 'sine';
                        
                        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                        
                        oscillator.start(audioCtx.currentTime);
                        oscillator.stop(audioCtx.currentTime + duration);
                    }
                };
            },
            play: function(soundName) {
                if (this.sounds[soundName]) {
                    this.sounds[soundName].play();
                }
            },
            toggle: function() {
                this.enabled = !this.enabled;
                document.getElementById('soundToggle').checked = this.enabled;
                return this.enabled;
            }
        };

        // ====== УПРАВЛЕНИЕ ЭКРАНАМИ ======
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function returnToMenu() {
            if (onlineGame.ws) {
                onlineGame.ws.close();
                onlineGame.ws = null;
            }
            showScreen('mainMenu');
            currentGame.gameActive = false;
        }

        // ====== ИНИЦИАЛИЗАЦИЯ ИГРЫ ======
        function initGame() {
            soundManager.init();
            loadSettings();
            showScreen('mainMenu');
        }

        function loadSettings() {
            const savedSound = localStorage.getItem('soundEnabled');
            if (savedSound !== null) {
                soundManager.enabled = JSON.parse(savedSound);
                document.getElementById('soundToggle').checked = soundManager.enabled;
            }
            
            const savedSize = localStorage.getItem('defaultBoardSize');
            if (savedSize) {
                document.getElementById('defaultBoardSize').value = savedSize;
            }
        }

        function saveSettings() {
            localStorage.setItem('soundEnabled', JSON.stringify(soundManager.enabled));
            localStorage.setItem('defaultBoardSize', document.getElementById('defaultBoardSize').value);
        }

        // ====== ЛОКАЛЬНАЯ ИГРА ======
        function startLocalGame(size) {
            currentGame.mode = 'local';
            currentGame.boardSize = size;
            currentGame.aiDifficulty = null;
            setupGame();
        }

        function startAIGame(difficulty, size) {
            currentGame.mode = 'ai';
            currentGame.boardSize = size;
            currentGame.aiDifficulty = difficulty;
            setupGame();
        }

        function setupGame() {
            const size = parseInt(currentGame.boardSize[0]);
            currentGame.board = Array(size * size).fill('');
            currentGame.currentPlayer = 'X';
            currentGame.gameActive = true;

            createBoard(size);
            updateGameDisplay();
            showScreen('gameScreen');

            // Обновляем информацию о режиме
            const modeText = currentGame.mode === 'ai' ? 
                `ИИ: ${getDifficultyName(currentGame.aiDifficulty)} (${currentGame.boardSize})` :
                `Локально (${currentGame.boardSize})`;
            document.getElementById('gameMode').textContent = modeText;

            // Скрываем чат для не-онлайн игр
            document.getElementById('onlineChat').style.display = 'none';
        }

        function createBoard(size) {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            board.className = `board board-${size}x${size}`;

            for (let i = 0; i < size * size; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                cell.addEventListener('click', () => makeMove(i));
                board.appendChild(cell);
            }
        }

        function makeMove(index) {
            if (!currentGame.gameActive || currentGame.board[index] !== '') return;

            soundManager.play('click');
            currentGame.board[index] = currentGame.currentPlayer;
            updateBoard();

            const result = checkWinner();
            if (result) {
                handleGameEnd(result);
            } else {
                currentGame.currentPlayer = currentGame.currentPlayer === 'X' ? 'O' : 'X';
                updateGameDisplay();

                // Ход ИИ
                if (currentGame.mode === 'ai' && currentGame.currentPlayer === 'O') {
                    setTimeout(makeAIMove, 500);
                }
            }
        }

        function makeAIMove() {
            if (!currentGame.gameActive || currentGame.currentPlayer !== 'O') return;

            const move = getAIMove();
            if (move !== -1) {
                makeMove(move);
            }
        }

        function getAIMove() {
            const size = parseInt(currentGame.boardSize[0]);
            const emptyCells = currentGame.board
                .map((cell, index) => cell === '' ? index : -1)
                .filter(index => index !== -1);

            if (emptyCells.length === 0) return -1;

            switch (currentGame.aiDifficulty) {
                case 'easy':
                    // Случайный ход
                    return emptyCells[Math.floor(Math.random() * emptyCells.length)];

                case 'medium':
                    // Пытается выиграть или блокировать
                    const winMove = findWinningMove('O');
                    if (winMove !== -1) return winMove;

                    const blockMove = findWinningMove('X');
                    if (blockMove !== -1) return blockMove;

                    return emptyCells[Math.floor(Math.random() * emptyCells.length)];

                case 'hard':
                    // Минимакс алгоритм для 3x3, для больших досок - улучшенная логика
                    if (size === 3) {
                        return minimax(currentGame.board, 'O').index;
                    } else {
                        const winMove = findWinningMove('O');
                        if (winMove !== -1) return winMove;

                        const blockMove = findWinningMove('X');
                        if (blockMove !== -1) return blockMove;

                        // Стратегия для больших досок
                        return getStrategicMove(size, emptyCells);
                    }
            }

            return emptyCells[0];
        }

        function findWinningMove(player) {
            const size = parseInt(currentGame.boardSize[0]);
            const winLength = size === 3 ? 3 : size === 4 ? 3 : 4;

            for (let i = 0; i < currentGame.board.length; i++) {
                if (currentGame.board[i] === '') {
                    currentGame.board[i] = player;
                    if (checkWinner()) {
                        currentGame.board[i] = '';
                        return i;
                    }
                    currentGame.board[i] = '';
                }
            }
            return -1;
        }

        function getStrategicMove(size, emptyCells) {
            // Предпочтение центральным и угловым клеткам
            const center = Math.floor(size * size / 2);
            if (emptyCells.includes(center)) return center;

            const corners = [0, size-1, size*(size-1), size*size-1];
            for (const corner of corners) {
                if (emptyCells.includes(corner)) return corner;
            }

            return emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }

        // ====== МИНИМАКС АЛГОРИТМ ======
        function minimax(newBoard, player) {
            const size = 3; // Только для 3x3
            const winLength = 3;

            // Проверка терминальных состояний
            const winner = checkWinner();
            if (winner === 'X') return { score: -10 };
            if (winner === 'O') return { score: 10 };
            if (winner === 'T') return { score: 0 };

            const emptyCells = newBoard.map((cell, index) => cell === '' ? index : -1).filter(i => i !== -1);
            if (emptyCells.length === 0) return { score: 0 };

            const moves = [];
            for (const index of emptyCells) {
                const move = { index: index };
                newBoard[index] = player;

                if (player === 'O') {
                    const result = minimax(newBoard, 'X');
                    move.score = result.score;
                } else {
                    const result = minimax(newBoard, 'O');
                    move.score = result.score;
                }

                newBoard[index] = '';
                moves.push(move);
            }

            let bestMove;
            if (player === 'O') {
                let bestScore = -Infinity;
                for (const move of moves) {
                    if (move.score > bestScore) {
                        bestScore = move.score;
                        bestMove = move;
                    }
                }
            } else {
                let bestScore = Infinity;
                for (const move of moves) {
                    if (move.score < bestScore) {
                        bestScore = move.score;
                        bestMove = move;
                    }
                }
            }

            return bestMove;
        }

        function checkWinner() {
            const size = parseInt(currentGame.boardSize[0]);
            const winLength = size === 3 ? 3 : size === 4 ? 3 : 4;

            // Проверка строк
            for (let row = 0; row < size; row++) {
                for (let col = 0; col <= size - winLength; col++) {
                    const player = currentGame.board[row * size + col];
                    if (player && Array.from({length: winLength}, (_, i) => currentGame.board[row * size + col + i])
                        .every(cell => cell === player)) {
                        return player;
                    }
                }
            }

            // Проверка столбцов
            for (let col = 0; col < size; col++) {
                for (let row = 0; row <= size - winLength; row++) {
                    const player = currentGame.board[row * size + col];
                    if (player && Array.from({length: winLength}, (_, i) => currentGame.board[(row + i) * size + col])
                        .every(cell => cell === player)) {
                        return player;
                    }
                }
            }

            // Проверка диагоналей
            for (let row = 0; row <= size - winLength; row++) {
                for (let col = 0; col <= size - winLength; col++) {
                    const player = currentGame.board[row * size + col];
                    if (player && Array.from({length: winLength}, (_, i) => currentGame.board[(row + i) * size + col + i])
                        .every(cell => cell === player)) {
                        return player;
                    }
                }
            }

            // Проверка обратных диагоналей
            for (let row = 0; row <= size - winLength; row++) {
                for (let col = winLength - 1; col < size; col++) {
                    const player = currentGame.board[row * size + col];
                    if (player && Array.from({length: winLength}, (_, i) => currentGame.board[(row + i) * size + col - i])
                        .every(cell => cell === player)) {
                        return player;
                    }
                }
            }

            // Ничья
            if (!currentGame.board.includes('')) return 'T';

            return null;
        }

        function handleGameEnd(result) {
            currentGame.gameActive = false;
            soundManager.play('win');

            if (result === 'T') {
                document.getElementById('gameStatus').textContent = 'Ничья! 🤝';
                currentGame.scores.T++;
            } else {
                document.getElementById('gameStatus').textContent = `Победил ${result === 'X' ? '❌' : '⭕'}!`;
                currentGame.scores[result]++;
                createConfetti();
            }

            updateScores();
        }

        function updateBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, index) => {
                cell.textContent = currentGame.board[index] ? 
                    (currentGame.board[index] === 'X' ? '❌' : '⭕') : '';
                cell.className = 'cell';
                if (currentGame.board[index] === 'X') cell.classList.add('x');
                if (currentGame.board[index] === 'O') cell.classList.add('o');
            });
        }

        function updateGameDisplay() {
            document.getElementById('gameStatus').textContent = 
                `Ход: ${currentGame.currentPlayer === 'X' ? '❌' : '⭕'}`;
        }

        function updateScores() {
            document.getElementById('scoreX').textContent = currentGame.scores.X;
            document.getElementById('scoreO').textContent = currentGame.scores.O;
            document.getElementById('scoreT').textContent = currentGame.scores.T;
        }

        // ====== ОНЛАЙН-РЕЖИМ ======
        async function createRoom() {
            const playerName = document.getElementById('playerName').value || 'Игрок';
            const roomSize = document.getElementById('roomSize').value;

            try {
                const response = await fetch(BACKEND_BASE + '/create', { method: 'POST' });
                const data = await response.json();
                
                onlineGame.roomCode = data.code;
                document.getElementById('roomCode').textContent = data.code;
                document.getElementById('roomInfo').style.display = 'block';
                
                connectWebSocket(data.code, playerName);
                
            } catch (error) {
                alert('Ошибка создания комнаты');
            }
        }

        function joinRoom() {
            const playerName = document.getElementById('joinPlayerName').value || 'Игрок';
            const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
            
            if (!code) {
                document.getElementById('joinStatus').textContent = 'Введите код комнаты';
                return;
            }

            document.getElementById('joinStatus').textContent = 'Соединяюсь...';
            connectWebSocket(code, playerName);
        }

        function connectWebSocket(code, name) {
            const backendHost = BACKEND_BASE.replace(/^https?:\/\//, '');
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${backendHost}/ws/${code}?name=${encodeURIComponent(name)}`;
            
            onlineGame.ws = new WebSocket(wsUrl);
            
            onlineGame.ws.onopen = () => {
                document.getElementById('joinStatus').textContent = 'Подключено, ожидаем соперника...';
            };
            
            onlineGame.ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleOnlineMessage(message);
            };
            
            onlineGame.ws.onclose = () => {
                document.getElementById('gameStatus').textContent = 'Соединение разорвано';
                onlineGame.connected = false;
            };
        }

        function handleOnlineMessage(message) {
            switch (message.type) {
                case 'ready':
                    currentGame.mode = 'online';
                    currentGame.boardSize = '3x3'; // По умолчанию для онлайн
                    currentGame.gameActive = true;
                    onlineGame.mySymbol = message.your_symbol;
                    onlineGame.opponentName = message.opponent;
                    onlineGame.connected = true;

                    setupGame();
                    document.getElementById('onlineChat').style.display = 'block';
                    document.getElementById('gameMode').textContent = `Онлайн vs ${onlineGame.opponentName}`;
                    break;

                case 'state':
                    currentGame.board = message.board;
                    currentGame.currentPlayer = message.turn;
                    updateBoard();
                    updateGameDisplay();

                    if (message.winner) {
                        handleGameEnd(message.winner);
                    }
                    break;

                case 'chat':
                    addChatMessage(message.sender, message.message, message.sender !== onlineGame.opponentName);
                    break;
            }
        }

        function sendMessage() {
            const message = document.getElementById('chatInput').value.trim();
            if (message && onlineGame.ws) {
                onlineGame.ws.send(JSON.stringify({ type: 'chat', message }));
                addChatMessage('Вы', message, true);
                document.getElementById('chatInput').value = '';
            }
        }

        function sendReaction(emoji) {
            if (onlineGame.ws) {
                onlineGame.ws.send(JSON.stringify({ type: 'chat', message: emoji }));
                addChatMessage('Вы', emoji, true);
            }
        }

        function addChatMessage(sender, message, isOwn) {
            const chat = document.getElementById('chatMessages');
            const messageEl = document.createElement('div');
            messageEl.innerHTML = `<strong style="color: ${isOwn ? '#00ffff' : '#ff00ff'}">${sender}:</strong> ${message}`;
            chat.appendChild(messageEl);
            chat.scrollTop = chat.scrollHeight;
        }

        function copyRoomCode() {
            navigator.clipboard.writeText(onlineGame.roomCode);
            alert('Код скопирован!');
        }

        // ====== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ======
        function getDifficultyName(difficulty) {
            const names = { easy: 'Легкий', medium: 'Средний', hard: 'Сложный' };
            return names[difficulty] || difficulty;
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = [
                        '#ff00ff', '#00ffff', '#39ff14', '#bf00ff'
                    ][Math.floor(Math.random() * 4)];
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 2000);
                }, i * 50);
            }
        }

        // ====== ОБРАБОТЧИКИ СОБЫТИЙ ======
        document.getElementById('soundToggle').addEventListener('change', function() {
            soundManager.enabled = this.checked;
            saveSettings();
        });

        document.getElementById('defaultBoardSize').addEventListener('change', saveSettings);

        // ====== ЗАПУСК ПРИЛОЖЕНИЯ ======
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
