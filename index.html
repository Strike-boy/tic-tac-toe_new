<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON Tic-Tac-Toe Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --neon-pink: #ff00ff;
            --neon-blue: #00ffff;
            --neon-green: #39ff14;
            --neon-purple: #bf00ff;
            --dark-bg: #0a0a1a;
            --darker-bg: #050510;
            --glass: rgba(255, 255, 255, 0.05);
            --card-bg: rgba(0, 0, 0, 0.3);
            --tg-theme-bg-color: var(--darker-bg);
            --tg-theme-text-color: white;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, var(--darker-bg));
            color: var(--tg-theme-text-color, white);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 255, 0.1) 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.1) 0%, transparent 25%),
                radial-gradient(circle at 40% 80%, rgba(57, 255, 20, 0.1) 0%, transparent 25%);
            z-index: -1;
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 0 50px rgba(255, 0, 255, 0.2),
                0 0 100px rgba(0, 255, 255, 0.1);
        }

        h1, h2 {
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
        }

        h2 {
            font-size: 1.8rem;
        }

        .telegram-info {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 255, 255, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 0, 255, 0.3);
        }

        .btn.neon-pink {
            background: linear-gradient(45deg, rgba(255, 0, 255, 0.2), rgba(191, 0, 255, 0.2));
            border: 1px solid var(--neon-pink);
        }

        .btn.neon-blue {
            background: linear-gradient(45deg, rgba(0, 255, 255, 0.2), rgba(0, 191, 255, 0.2));
            border: 1px solid var(--neon-blue);
        }

        .btn.neon-green {
            background: linear-gradient(45deg, rgba(57, 255, 20, 0.2), rgba(20, 200, 20, 0.2));
            border: 1px solid var(--neon-green);
        }

        .btn-back {
            width: auto;
            padding: 10px 20px;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-restart {
            width: auto;
            padding: 10px 20px;
            background: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--neon-green);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .cell {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .cell.x {
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
        }

        .cell.o {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .cell.winner {
            animation: pulse 1s infinite;
            background: rgba(57, 255, 20, 0.1);
        }

        .game-info {
            text-align: center;
            margin: 15px 0;
        }

        .status {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--neon-green);
            margin-bottom: 10px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }

        .score-item {
            text-align: center;
            padding: 10px;
        }

        .score-value {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .chat-container {
            margin-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
        }

        .chat-messages {
            height: 100px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px;
                padding: 20px;
            }
            
            .cell {
                font-size: 2rem;
            }
            
            .game-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .btn-restart {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>

    <!-- Главное меню -->
    <div id="mainMenu" class="screen active">
        <div class="container">
            <h1>NEON TIC-TAC-TOE</h1>
            <div class="telegram-info" id="tgInfo">
                <div id="userInfo">🔄 Загрузка...</div>
            </div>
            <button class="btn neon-pink" onclick="showScreen('localMenu')">👥 Локальная игра</button>
            <button class="btn neon-blue" onclick="showScreen('aiMenu')">🤖 Игра с ИИ</button>
            <button class="btn neon-green" onclick="showScreen('onlineMenu')">🌐 Онлайн матч</button>
            <button class="btn" onclick="shareGame()">📤 Поделиться</button>
        </div>
    </div>

    <!-- Меню локальной игры -->
    <div id="localMenu" class="screen">
        <div class="container">
            <h2>Локальная игра</h2>
            <button class="btn" onclick="startLocalGame()">🎮 Начать игру</button>
            <button class="btn btn-back" onclick="showScreen('mainMenu')">← Назад</button>
        </div>
    </div>

    <!-- Меню ИИ -->
    <div id="aiMenu" class="screen">
        <div class="container">
            <h2>Игра с ИИ</h2>
            <button class="btn" onclick="startAIGame('easy')">😊 Легкий уровень</button>
            <button class="btn" onclick="startAIGame('medium')">😐 Средний уровень</button>
            <button class="btn" onclick="startAIGame('hard')">😠 Сложный уровень</button>
            <button class="btn btn-back" onclick="showScreen('mainMenu')">← Назад</button>
        </div>
    </div>

    <!-- Меню онлайн игры -->
    <div id="onlineMenu" class="screen">
        <div class="container">
            <h2>Онлайн матч</h2>
            <button class="btn neon-pink" onclick="showScreen('createRoom')">➕ Создать комнату</button>
            <button class="btn neon-blue" onclick="showScreen('joinRoom')">🔗 Присоединиться</button>
            <button class="btn btn-back" onclick="showScreen('mainMenu')">← Назад</button>
        </div>
    </div>

    <!-- Создание комнаты -->
    <div id="createRoom" class="screen">
        <div class="container">
            <h2>Создать комнату</h2>
            <button class="btn neon-pink" onclick="createRoom()">Создать комнату</button>
            <div id="roomInfo" class="game-info" style="display: none;">
                <p>Код комнаты: <strong id="roomCode"></strong></p>
                <p>Ожидаем соперника...</p>
                <button class="btn" onclick="shareRoom()">📤 Пригласить друга</button>
            </div>
            <button class="btn btn-back" onclick="showScreen('onlineMenu')">← Назад</button>
        </div>
    </div>

    <!-- Присоединение к комнате -->
    <div id="joinRoom" class="screen">
        <div class="container">
            <h2>Присоединиться к комнате</h2>
            <input type="text" id="joinCodeInput" placeholder="Код комнаты" class="input-field">
            <button class="btn neon-blue" onclick="joinRoom()">Присоединиться</button>
            <div id="joinStatus" class="game-info"></div>
            <button class="btn btn-back" onclick="showScreen('onlineMenu')">← Назад</button>
        </div>
    </div>

    <!-- Игровой экран -->
    <div id="gameScreen" class="screen">
        <div class="container">
            <div class="game-header">
                <button class="btn btn-back" onclick="returnToMenu()">🏠 Меню</button>
                <div id="gameMode"></div>
                <button class="btn btn-restart" onclick="restartGame()" id="restartBtn">🔄 Рестарт</button>
            </div>

            <div class="game-info">
                <div class="status" id="gameStatus">Ход: ❌</div>
                <div id="playerInfo">Вы: <span id="myNameDisplay">Игрок</span> | Соперник: <span id="opponentNameDisplay">—</span></div>
            </div>

            <div class="board" id="gameBoard">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <div class="score-board">
                <div class="score-item">
                    <div>❌</div>
                    <div class="score-value" id="scoreX">0</div>
                </div>
                <div class="score-item">
                    <div>🤝</div>
                    <div class="score-value" id="scoreT">0</div>
                </div>
                <div class="score-item">
                    <div>⭕</div>
                    <div class="score-value" id="scoreO">0</div>
                </div>
            </div>

            <!-- Чат (только для онлайн режима) -->
            <div id="onlineChat" class="chat-container" style="display: none;">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Сообщение...">
                    <button class="btn" onclick="sendMessage()">📨</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ====== TELEGRAM WEB APP INTEGRATION ======
        let tg = window.Telegram.WebApp;
        let tgUser = null;

        function initTelegram() {
            tg.ready();
            tg.expand();
            
            // Применяем тему Telegram
            if (tg.themeParams) {
                document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#0a0a1a');
                document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#ffffff');
            }
            
            // Получаем данные пользователя
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tgUser = tg.initDataUnsafe.user;
                document.getElementById('userInfo').innerHTML = 
                    `👋 Привет, <strong>${tgUser.first_name}</strong>!`;
            } else {
                document.getElementById('userInfo').textContent = '👾 Добро пожаловать!';
            }
            
            // Настраиваем главную кнопку
            tg.MainButton.setText('Играть');
            tg.MainButton.onClick(() => {
                if (currentGame.gameActive && currentGame.mode) {
                    tg.showAlert('Игра уже идет!');
                } else {
                    showScreen('mainMenu');
                }
            });
        }

        function shareGame() {
            const url = 'https://t.me/your_bot_username';
            const text = '🎮 Сыграем в крестики-нолики? Присоединяйся!';
            
            if (tg.openTelegramLink) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
            } else {
                tg.showAlert('Поделитесь ссылкой с друзьями:\n' + url);
            }
        }

        function shareRoom() {
            if (!onlineGame.roomCode) return;
            
            const url = `https://t.me/tic_tac_toe0_bot?startapp=room_${onlineGame.roomCode}`;
            const text = `🎮 Присоединяйся к игре! Код комнаты: ${onlineGame.roomCode}`;
            
            if (tg.openTelegramLink) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`);
            } else {
                navigator.clipboard.writeText(onlineGame.roomCode);
                tg.showAlert('Код комнаты скопирован: ' + onlineGame.roomCode);
            }
        }

        // ====== КОНФИГУРАЦИЯ ======
        const BACKEND_BASE = "https://tic-tac-toe-site.onrender.com";

        // ====== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ======
        let currentGame = {
            mode: null,
            board: ['', '', '', '', '', '', '', '', ''],
            currentPlayer: 'X',
            gameActive: false,
            aiDifficulty: null,
            scores: { X: 0, O: 0, T: 0 }
        };

        let onlineGame = {
            ws: null,
            roomCode: '',
            mySymbol: '',
            myName: '',
            opponentName: '',
            connected: false
        };

        // ====== УПРАВЛЕНИЕ ЭКРАНАМИ ======
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
            
            // Вибрация при переходе
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function returnToMenu() {
            if (onlineGame.ws) {
                onlineGame.ws.close();
                onlineGame.ws = null;
            }
            showScreen('mainMenu');
            currentGame.gameActive = false;
        }

        // ====== ЛОКАЛЬНАЯ ИГРА ======
        function startLocalGame() {
            currentGame.mode = 'local';
            currentGame.aiDifficulty = null;
            setupGame();
        }

        function startAIGame(difficulty) {
            currentGame.mode = 'ai';
            currentGame.aiDifficulty = difficulty;
            setupGame();
        }

        function setupGame() {
            currentGame.board = ['', '', '', '', '', '', '', '', ''];
            currentGame.currentPlayer = 'X';
            currentGame.gameActive = true;

            updateBoard();
            updateGameDisplay();
            showScreen('gameScreen');

            const modeText = currentGame.mode === 'ai' ? 
                `ИИ: ${getDifficultyName(currentGame.aiDifficulty)}` :
                currentGame.mode === 'online' ?
                `Онлайн vs ${onlineGame.opponentName || '...'}` :
                `Локальная игра`;
            
            document.getElementById('gameMode').textContent = modeText;

            let myName = tgUser ? tgUser.first_name : 'Игрок';
            if (currentGame.mode === 'online') myName = onlineGame.myName || myName;
            
            document.getElementById('myNameDisplay').textContent = myName;
            document.getElementById('opponentNameDisplay').textContent = 
                currentGame.mode === 'ai' ? '🤖 ИИ' : 
                currentGame.mode === 'online' ? (onlineGame.opponentName || 'Соперник') : 'Игрок 2';

            document.getElementById('onlineChat').style.display = currentGame.mode === 'online' ? 'block' : 'none';
        }

        function makeMove(index) {
            if (!currentGame.gameActive || currentGame.board[index] !== '') return;

            // Вибрация при ходе
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            if (currentGame.mode === 'online') {
                if (!onlineGame.ws || !onlineGame.connected) {
                    tg.showAlert('Сначала подключитесь к игре');
                    return;
                }
                
                if (currentGame.currentPlayer !== onlineGame.mySymbol) {
                    tg.showAlert('Сейчас не ваш ход');
                    return;
                }
                
                onlineGame.ws.send(JSON.stringify({ 
                    type: 'move', 
                    index: index 
                }));
            } else {
                currentGame.board[index] = currentGame.currentPlayer;
                updateBoard();

                const result = checkWinner();
                if (result) {
                    handleGameEnd(result);
                } else {
                    currentGame.currentPlayer = currentGame.currentPlayer === 'X' ? 'O' : 'X';
                    updateGameDisplay();

                    if (currentGame.mode === 'ai' && currentGame.currentPlayer === 'O') {
                        setTimeout(makeAIMove, 500);
                    }
                }
            }
        }

        function makeAIMove() {
            if (!currentGame.gameActive || currentGame.currentPlayer !== 'O') return;

            const availableMoves = currentGame.board
                .map((cell, index) => cell === '' ? index : null)
                .filter(index => index !== null);

            if (availableMoves.length > 0) {
                const randomIndex = availableMoves[Math.floor(Math.random() * availableMoves.length)];
                makeMove(randomIndex);
            }
        }

        function checkWinner() {
            const winPatterns = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];
            
            for (const pattern of winPatterns) {
                const [a, b, c] = pattern;
                if (currentGame.board[a] && currentGame.board[a] === currentGame.board[b] && currentGame.board[a] === currentGame.board[c]) {
                    return { winner: currentGame.board[a], cells: pattern };
                }
            }
            
            if (!currentGame.board.includes('')) {
                return { winner: 'T' };
            }
            
            return null;
        }

        function handleGameEnd(result) {
            currentGame.gameActive = false;

            // Сильная вибрация при окончании игры
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred(result.winner === 'T' ? 'warning' : 'success');
            }

            if (result.winner === 'T') {
                document.getElementById('gameStatus').textContent = 'Ничья! 🤝';
                currentGame.scores.T++;
            } else {
                document.getElementById('gameStatus').textContent = `Победил ${result.winner === 'X' ? '❌' : '⭕'}!`;
                currentGame.scores[result.winner]++;
                
                result.cells.forEach(index => {
                    document.querySelector(`.cell[data-index="${index}"]`).classList.add('winner');
                });
            }

            updateScores();
        }

        function updateBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, index) => {
                cell.textContent = currentGame.board[index] ? 
                    (currentGame.board[index] === 'X' ? '❌' : '⭕') : '';
                cell.className = 'cell';
                if (currentGame.board[index] === 'X') cell.classList.add('x');
                if (currentGame.board[index] === 'O') cell.classList.add('o');
            });
        }

        function updateGameDisplay() {
            document.getElementById('gameStatus').textContent = 
                `Ход: ${currentGame.currentPlayer === 'X' ? '❌' : '⭕'}`;
        }

        function updateScores() {
            document.getElementById('scoreX').textContent = currentGame.scores.X;
            document.getElementById('scoreO').textContent = currentGame.scores.O;
            document.getElementById('scoreT').textContent = currentGame.scores.T;
        }

        function restartGame() {
            if (currentGame.mode === 'online') {
                if (onlineGame.ws && onlineGame.connected) {
                    onlineGame.ws.send(JSON.stringify({ type: 'rematch' }));
                }
            } else {
                setupGame();
            }
        }

        // ====== ОНЛАЙН-РЕЖИМ ======
        async function createRoom() {
            const playerName = tgUser ? tgUser.first_name : 'Игрок';

            try {
                const response = await fetch(BACKEND_BASE + '/create', { 
                    method: 'POST'
                });
                
                if (!response.ok) throw new Error('Ошибка сервера');
                
                const data = await response.json();
                
                onlineGame.roomCode = data.code;
                document.getElementById('roomCode').textContent = data.code;
                document.getElementById('roomInfo').style.display = 'block';
                
                connectWebSocket(data.code, playerName);
                
            } catch (error) {
                tg.showAlert('Ошибка создания комнаты: ' + error.message);
            }
        }

        function joinRoom() {
            const playerName = tgUser ? tgUser.first_name : 'Игрок';
            const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
            
            if (!code) {
                document.getElementById('joinStatus').textContent = 'Введите код комнаты';
                return;
            }

            document.getElementById('joinStatus').textContent = 'Соединяюсь...';
            connectWebSocket(code, playerName);
        }

        function connectWebSocket(code, name) {
            const backendHost = BACKEND_BASE.replace(/^https?:\/\//, '');
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${backendHost}/ws/${code}?name=${encodeURIComponent(name)}`;
            
            onlineGame.ws = new WebSocket(wsUrl);
            onlineGame.myName = name;
            
            onlineGame.ws.onopen = () => {
                if (document.getElementById('joinStatus')) {
                    document.getElementById('joinStatus').textContent = 'Подключено, ожидаем соперника...';
                }
            };
            
            onlineGame.ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleOnlineMessage(message);
            };
            
            onlineGame.ws.onclose = () => {
                document.getElementById('gameStatus').textContent = 'Соединение разорвано';
                onlineGame.connected = false;
            };
        }

        function handleOnlineMessage(message) {
            switch (message.type) {
                case 'ready':
                    currentGame.mode = 'online';
                    currentGame.gameActive = true;
                    onlineGame.mySymbol = message.your_symbol;
                    onlineGame.opponentName = message.opponent;
                    onlineGame.connected = true;

                    setupGame();
                    document.getElementById('onlineChat').style.display = 'block';
                    
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                    break;

                case 'state':
                    currentGame.board = message.board;
                    currentGame.currentPlayer = message.turn;
                    updateBoard();
                    updateGameDisplay();
                    
                    if (message.winner) {
                        handleGameEnd({ winner: message.winner });
                    } else {
                        currentGame.gameActive = true;
                    }
                    break;

                case 'chat':
                    addChatMessage(message.sender, message.message, message.sender !== onlineGame.opponentName);
                    break;

                case 'error':
                    tg.showAlert(message.msg);
                    break;
            }
        }

        function sendMessage() {
            const message = document.getElementById('chatInput').value.trim();
            if (message && onlineGame.ws) {
                onlineGame.ws.send(JSON.stringify({ type: 'chat', message }));
                addChatMessage('Вы', message, true);
                document.getElementById('chatInput').value = '';
            }
        }

        function addChatMessage(sender, message, isOwn) {
            const chat = document.getElementById('chatMessages');
            const messageEl = document.createElement('div');
            messageEl.innerHTML = `<strong style="color: ${isOwn ? '#00ffff' : '#ff00ff'}">${sender}:</strong> ${message}`;
            chat.appendChild(messageEl);
            chat.scrollTop = chat.scrollHeight;
        }

        function getDifficultyName(difficulty) {
            const names = { easy: 'Легкий', medium: 'Средний', hard: 'Сложный' };
            return names[difficulty] || difficulty;
        }

        // ====== ИНИЦИАЛИЗАЦИЯ ИГРЫ ======
        function initGame() {
            // Инициализация Telegram
            initTelegram();
            
            // Обработка deep link (если пришли по ссылке с кодом комнаты)
            if (tg.initDataUnsafe && tg.initDataUnsafe.start_param) {
                const startParam = tg.initDataUnsafe.start_param;
                if (startParam.startsWith('room_')) {
                    const roomCode = startParam.replace('room_', '');
                    document.getElementById('joinCodeInput').value = roomCode;
                    showScreen('joinRoom');
                }
            }
            
            // Добавляем обработчики для клеток
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, index) => {
                cell.addEventListener('click', () => makeMove(index));
            });
            
            // Обработчик Enter в чате
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            
            showScreen('mainMenu');
        }

        // Запускаем игру при загрузке страницы
        document.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
