<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>NEON Tic-Tac-Toe</title>
<style>
  :root {
    --neon-pink: #ff00ff;
    --neon-blue: #00ffff;
    --neon-green: #39ff14;
    --neon-purple: #bf00ff;
    --dark-bg: #0a0a1a;
    --darker-bg: #050510;
    --glass: rgba(255, 255, 255, 0.05);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    min-height: 100vh;
    background: var(--darker-bg);
    background-image: 
      radial-gradient(circle at 15% 50%, rgba(255, 0, 255, 0.1) 0%, transparent 20%),
      radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.1) 0%, transparent 20%),
      radial-gradient(circle at 50% 80%, rgba(57, 255, 20, 0.1) 0%, transparent 20%);
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 1000px;
    background: var(--glass);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 
      0 0 50px rgba(255, 0, 255, 0.2),
      0 0 75px rgba(0, 255, 255, 0.2),
      inset 0 0 50px rgba(0, 0, 0, 0.3);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .title {
    font-size: 2.2rem;
    font-weight: 800;
    background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue), var(--neon-green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
  }

  .subtitle {
    font-size: 1rem;
    opacity: 0.8;
    margin-top: 5px;
  }

  .controls {
    display: flex;
    gap: 12px;
  }

  .btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: white;
    padding: 12px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s ease;
    backdrop-filter: blur(5px);
  }

  .btn:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: translateY(-2px);
    box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
  }

  .btn.neon-pink {
    background: linear-gradient(45deg, rgba(255, 0, 255, 0.2), rgba(191, 0, 255, 0.2));
    border: 1px solid var(--neon-pink);
    box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
  }

  .btn.neon-blue {
    background: linear-gradient(45deg, rgba(0, 255, 255, 0.2), rgba(0, 191, 255, 0.2));
    border: 1px solid var(--neon-blue);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 25px;
  }

  .game-section {
    background: rgba(0, 0, 0, 0.2);
    padding: 20px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .game-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .mode-badge {
    padding: 8px 16px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    font-weight: 600;
  }

  .player-info {
    text-align: right;
  }

  .timer {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--neon-green);
    text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 20px 0;
  }

  .cell {
    aspect-ratio: 1;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.5rem;
    cursor: pointer;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .cell:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
  }

  .cell.x {
    color: var(--neon-pink);
    text-shadow: 0 0 15px var(--neon-pink);
  }

  .cell.o {
    color: var(--neon-blue);
    text-shadow: 0 0 15px var(--neon-blue);
  }

  .cell.winner {
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .cell::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transition: left 0.5s;
  }

  .cell:hover::before {
    left: 100%;
  }

  .status {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 600;
    margin: 15px 0;
    color: var(--neon-green);
    text-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
  }

  .score-board {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 15px;
  }

  .score-item {
    text-align: center;
    padding: 10px 20px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .score-value {
    font-size: 1.5rem;
    font-weight: 700;
  }

  .score-x { color: var(--neon-pink); }
  .score-o { color: var(--neon-blue); }
  .score-t { color: var(--neon-green); }

  .menu-section {
    background: rgba(0, 0, 0, 0.2);
    padding: 20px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .mode-selector {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .mode-btn {
    flex: 1;
    text-align: center;
    padding: 15px;
  }

  .panel {
    margin-top: 20px;
  }

  .input-group {
    margin-bottom: 15px;
  }

  .input-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: 600;
    color: var(--neon-blue);
  }

  .input-group input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: white;
    font-size: 1rem;
  }

  .input-group input:focus {
    outline: none;
    border-color: var(--neon-blue);
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }

  .action-buttons {
    display: flex;
    gap: 10px;
    margin: 15px 0;
  }

  .action-btn {
    flex: 1;
    text-align: center;
  }

  .chat-container {
    margin-top: 25px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 15px;
  }

  .chat-messages {
    height: 150px;
    overflow-y: auto;
    background: rgba(0, 0, 0, 0.3);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .chat-input {
    display: flex;
    gap: 10px;
  }

  .chat-input input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: white;
  }

  .hidden {
    display: none;
  }

  .online-status {
    margin-top: 10px;
    padding: 10px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    text-align: center;
  }

  /* Анимации */
  @keyframes appear {
    from {
      opacity: 0;
      transform: scale(0.8);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .cell.x, .cell.o {
    animation: appear 0.3s ease-out;
  }

  /* Адаптивность */
  @media (max-width: 900px) {
    .main-grid {
      grid-template-columns: 1fr;
    }
    
    .header {
      flex-direction: column;
      gap: 15px;
      text-align: center;
    }
    
    .title {
      font-size: 1.8rem;
    }
  }

  /* Стили для победной линии */
  .win-line {
    position: absolute;
    background: var(--neon-green);
    box-shadow: 0 0 10px var(--neon-green);
    z-index: 1;
  }

  /* Эмодзи реакции */
  .emoji-reaction {
    position: absolute;
    font-size: 2rem;
    animation: floatUp 2s ease-out;
    z-index: 100;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(0);
      opacity: 0;
    }
    50% {
      opacity: 1;
      transform: translateY(-50px) scale(1.2);
    }
    100% {
      transform: translateY(-100px) scale(0.8);
      opacity: 0;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <div class="title">NEON TIC-TAC-TOE</div>
        <div class="subtitle">Игра будущего уже здесь</div>
      </div>
      <div class="controls">
        <button class="btn neon-pink" id="resetAll">🔄 Новая игра</button>
        <button class="btn neon-blue" id="restartBtn">⚡ Рестарт</button>
      </div>
    </div>

    <div class="main-grid">
      <!-- Левая секция - игровое поле -->
      <div class="game-section">
        <div class="game-info">
          <div class="mode-badge" id="modeLabel">Локально</div>
          <div class="player-info">
            <div>Вы: <strong id="myNameDisplay">Гость</strong></div>
            <div>Соперник: <strong id="opponentNameDisplay">—</strong></div>
          </div>
        </div>

        <div class="timer" id="timer">30</div>
        
        <div class="board" id="board">
          <div class="cell" data-index="0"></div>
          <div class="cell" data-index="1"></div>
          <div class="cell" data-index="2"></div>
          <div class="cell" data-index="3"></div>
          <div class="cell" data-index="4"></div>
          <div class="cell" data-index="5"></div>
          <div class="cell" data-index="6"></div>
          <div class="cell" data-index="7"></div>
          <div class="cell" data-index="8"></div>
        </div>

        <div class="status" id="status">Ход: ❌</div>
        
        <div class="score-board">
          <div class="score-item">
            <div>❌</div>
            <div class="score-value score-x" id="scoreX">0</div>
          </div>
          <div class="score-item">
            <div>🤝</div>
            <div class="score-value score-t" id="scoreT">0</div>
          </div>
          <div class="score-item">
            <div>⭕</div>
            <div class="score-value score-o" id="scoreO">0</div>
          </div>
        </div>
      </div>

      <!-- Правая секция - меню -->
      <div class="menu-section">
        <div class="mode-selector">
          <button class="btn mode-btn" id="btnLocal">🎮 Локально</button>
          <button class="btn mode-btn" id="btnOnline">🌐 Онлайн</button>
        </div>

        <div id="localPanel">
          <div class="input-group">
            <label>Ваш никнейм</label>
            <input id="localName" type="text" placeholder="Неоновый воин" />
          </div>
          
          <div class="action-buttons">
            <button class="btn action-btn" id="btnVsAI">🤖 Играть с ИИ</button>
          </div>
        </div>

        <div id="onlinePanel" class="hidden">
          <div class="input-group">
            <label>Твой никнейм</label>
            <input id="onlineName" type="text" placeholder="Неоновый воин" />
          </div>

          <div class="action-buttons">
            <button class="btn neon-pink action-btn" id="createBtn">➕ Создать комнату</button>
            <button class="btn neon-blue action-btn" id="joinBtn">🔗 Присоединиться</button>
          </div>

          <div id="createPanel" class="hidden">
            <div class="input-group">
              <label>Код комнаты</label>
              <input id="roomCode" type="text" readonly />
            </div>
            <button class="btn action-btn" id="copyCode">📋 Скопировать код</button>
          </div>

          <div id="joinPanel" class="hidden">
            <div class="input-group">
              <label>Введите код комнаты</label>
              <input id="joinCodeInput" type="text" placeholder="ABCD" />
            </div>
            <button class="btn action-btn" id="joinRoomBtn">🚀 Войти</button>
            <div id="joinMsg" class="online-status"></div>
          </div>

          <div id="onlineInfo" class="online-status">Отключено</div>

          <!-- Чат -->
          <div class="chat-container">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
              <input type="text" id="chatInput" placeholder="Сообщение..." />
              <button class="btn" id="sendChatBtn">📨</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    <script>
/* ====== НАСТРОЙКИ ====== */
const BACKEND_BASE = "https://tic-tac-toe-site.onrender.com"; // ЗАМЕНИ на свой URL

/* ====== UI Elements ====== */
const boardEls = [...document.querySelectorAll('.cell')];
const statusEl = document.getElementById('status');
const timerEl = document.getElementById('timer');
const modeLabel = document.getElementById('modeLabel');
const btnLocal = document.getElementById('btnLocal');
const btnOnline = document.getElementById('btnOnline');
const localPanel = document.getElementById('localPanel');
const onlinePanel = document.getElementById('onlinePanel');
const createBtn = document.getElementById('createBtn');
const joinBtn = document.getElementById('joinBtn');
const createPanel = document.getElementById('createPanel');
const joinPanel = document.getElementById('joinPanel');
const roomCodeInput = document.getElementById('roomCode');
const copyCodeBtn = document.getElementById('copyCode');
const joinCodeInput = document.getElementById('joinCodeInput');
const joinRoomBtn = document.getElementById('joinRoomBtn');
const joinMsg = document.getElementById('joinMsg');
const onlineInfo = document.getElementById('onlineInfo');
const myNameDisplay = document.getElementById('myNameDisplay');
const opponentNameDisplay = document.getElementById('opponentNameDisplay');
const localNameInput = document.getElementById('localName');
const onlineNameInput = document.getElementById('onlineName');
const resetAllBtn = document.getElementById('resetAll');
const restartBtn = document.getElementById('restartBtn');
const scoreX = document.getElementById('scoreX');
const scoreO = document.getElementById('scoreO');
const scoreT = document.getElementById('scoreT');
const btnVsAI = document.getElementById('btnVsAI');
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const sendChatBtn = document.getElementById('sendChatBtn');

/* ====== Game State ====== */
let mode = 'local';
let localGame = { board: Array(9).fill(''), turn: 'X', active: true };
let online = { 
  ws: null, code: null, mySymbol: null, 
  board: Array(9).fill(''), turn: 'X', 
  active: false, opponent: null, 
  timer: null, timeLeft: 30 
};
let scores = { X: 0, O: 0, T: 0 };
let gameSize = 3; // 3x3 по умолчанию
let isPlayingWithAI = false;

/* ====== Timer Functions ====== */
function startTimer() {
  if (online.timer) clearInterval(online.timer);
  
  online.timeLeft = 30;
  timerEl.textContent = online.timeLeft;
  
  online.timer = setInterval(() => {
    online.timeLeft--;
    timerEl.textContent = online.timeLeft;
    
    if (online.timeLeft <= 0) {
      clearInterval(online.timer);
      if (online.active && online.turn === online.mySymbol) {
        // Автоматический ход при тайм-ауте
        makeAIMove();
      }
    }
  }, 1000);
}

function stopTimer() {
  if (online.timer) {
    clearInterval(online.timer);
    online.timer = null;
  }
}

/* ====== AI Logic ====== */
function makeAIMove() {
  if (!localGame.active || !isPlayingWithAI || localGame.turn !== 'O') return;
  
  // Простой ИИ: случайный ход
  const emptyCells = localGame.board
    .map((cell, index) => cell === '' ? index : null)
    .filter(index => index !== null);
  
  if (emptyCells.length > 0) {
    const randomIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
    setTimeout(() => {
      onCellClick(randomIndex);
    }, 1000);
  }
}

/* ====== Chat Functions ====== */
function addChatMessage(sender, message) {
  const messageEl = document.createElement('div');
  messageEl.innerHTML = `<strong>${sender}:</strong> ${message}`;
  messageEl.style.marginBottom = '5px';
  chatMessages.appendChild(messageEl);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

/* ====== Win Line Animation ====== */
function showWinLine(winningCombo) {
  winningCombo.forEach(index => {
    boardEls[index].classList.add('winner');
  });
}

/* ====== Emoji Reactions ====== */
function showEmojiReaction(emoji) {
  const emojiEl = document.createElement('div');
  emojiEl.className = 'emoji-reaction';
  emojiEl.textContent = emoji;
  emojiEl.style.left = Math.random() * 300 + 'px';
  document.body.appendChild(emojiEl);
  
  setTimeout(() => {
    emojiEl.remove();
  }, 2000);
}

/* ====== Game Core Functions ====== */
function setMode(m) {
  mode = m;
  modeLabel.textContent = m === 'local' ? 'Локально' : 'Онлайн';
  localPanel.classList.toggle('hidden', m !== 'local');
  onlinePanel.classList.toggle('hidden', m !== 'online');
  resetBoard();
}

function resetBoard() {
  localGame.board = Array(9).fill('');
  localGame.turn = 'X';
  localGame.active = true;
  
  online.active = false;
  onlineInfo.textContent = '';
  roomCodeInput.value = '';
  createPanel.classList.add('hidden');
  joinPanel.classList.add('hidden');
  joinMsg.textContent = '';
  stopTimer();
  
  myNameDisplay.textContent = mode === 'local' ? 
    (localNameInput.value || 'Неоновый воин') : 
    (onlineNameInput.value || 'Неоновый воин');
  
  boardEls.forEach((cell, i) => {
    cell.textContent = '';
    cell.className = 'cell';
    cell.dataset.index = i;
  });
  
  statusEl.textContent = `Ход: ${localGame.turn === 'X' ? '❌' : '⭕'}`;
  timerEl.textContent = '30';
}

function checkWin(board) {
  const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  
  for (const [a, b, c] of wins) {
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      return { winner: board[a], combo: [a, b, c] };
    }
  }
  
  if (!board.includes('')) return { winner: 'D', combo: [] };
  return null;
}

boardEls.forEach((cell, idx) => {
  cell.addEventListener('click', () => onCellClick(idx));
});

function onCellClick(i) {
  if (mode === 'local') {
    if (!localGame.active) return;
    if (localGame.board[i]) return;
    
    localGame.board[i] = localGame.turn;
    renderBoard();
    
    const result = checkWin(localGame.board);
    if (result) {
      localGame.active = false;
      
      if (result.winner === 'D') {
        statusEl.textContent = 'Ничья 🤝';
        scores.T++;
        showEmojiReaction('🤝');
      } else {
        statusEl.textContent = `Победил ${result.winner === 'X' ? '❌' : '⭕'}!`;
        scores[result.winner]++;
        showWinLine(result.combo);
        showEmojiReaction(result.winner === 'X' ? '🎉' : '🔥');
      }
      
      updateScores();
      return;
    }
    
    localGame.turn = localGame.turn === 'X' ? 'O' : 'X';
    statusEl.textContent = `Ход: ${localGame.turn === 'X' ? '❌' : '⭕'}`;
    
    if (isPlayingWithAI && localGame.turn === 'O') {
      makeAIMove();
    }
    
  } else {
    if (!online.active) {
      alert('Сначала создай или присоединись к комнате.');
      return;
    }
    if (online.turn !== online.mySymbol) return;
    if (online.board[i]) return;
    
    const msg = { type: 'move', index: i };
    online.ws.send(JSON.stringify(msg));
    stopTimer();
  }
}

function renderBoard() {
  const board = mode === 'local' ? localGame.board : online.board;
  
  board.forEach((value, i) => {
    boardEls[i].textContent = value ? (value === 'X' ? '❌' : '⭕') : '';
    boardEls[i].classList.toggle('x', value === 'X');
    boardEls[i].classList.toggle('o', value === 'O');
  });
}

function updateScores() {
  scoreX.textContent = scores.X;
  scoreO.textContent = scores.O;
  scoreT.textContent = scores.T;
}

/* ====== Online Functions ====== */
async function apiCreate() {
  const url = BACKEND_BASE + '/create';
  try {
    const response = await fetch(url, { method: 'POST' });
    const data = await response.json();
    return data.code;
  } catch (error) {
    console.error('Ошибка создания комнаты:', error);
    alert('Ошибка создания комнаты. Проверь бэкенд.');
    return null;
  }
}

function connectWS(code, name) {
  if (!BACKEND_BASE) {
    alert('Задай BACKEND_BASE в настройках');
    return;
  }
  
  const backendHost = BACKEND_BASE.replace(/^https?:\/\//, '');
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${protocol}//${backendHost}/ws/${code}?name=${encodeURIComponent(name || 'Игрок')}`;
  
  online.ws = new WebSocket(wsUrl);
  online.code = code;
  onlineInfo.textContent = 'Соединяюсь...';
  
  online.ws.onopen = () => {
    onlineInfo.textContent = 'Ожидание соперника...';
  };
  
  online.ws.onmessage = (event) => {
    const message = JSON.parse(event.data);
    handleOnlineMessage(message);
  };
  
  online.ws.onclose = () => {
    onlineInfo.textContent = 'Соединение закрыто';
    online.active = false;
    stopTimer();
  };
  
  online.ws.onerror = (error) => {
    console.error('WebSocket error:', error);
    onlineInfo.textContent = 'Ошибка соединения';
  };
}

function handleOnlineMessage(msg) {
  switch (msg.type) {
    case 'error':
      alert(msg.msg);
      onlineInfo.textContent = msg.msg;
      online.ws.close();
      break;
      
    case 'waiting':
      onlineInfo.textContent = 'Комната создана, ждём соперника...';
      roomCodeInput.value = online.code;
      createPanel.classList.remove('hidden');
      joinPanel.classList.add('hidden');
      online.active = true;
      online.mySymbol = msg.your_symbol;
      online.board = msg.board;
      online.turn = msg.turn;
      online.opponent = msg.opponent;
      myNameDisplay.textContent = onlineNameInput.value || 'Игрок';
      renderBoard();
      break;
      
    case 'ready':
      online.active = true;
      online.board = msg.board;
      online.turn = msg.turn;
      online.mySymbol = msg.your_symbol;
      online.opponent = msg.opponent;
      myNameDisplay.textContent = onlineNameInput.value || 'Игрок';
      opponentNameDisplay.textContent = online.opponent || '—';
      onlineInfo.textContent = `Игра началась! Ты играешь ${online.mySymbol}`;
      renderBoard();
      statusEl.textContent = `Ход: ${online.turn === 'X' ? '❌' : '⭕'}`;
      
      if (online.turn === online.mySymbol) {
        startTimer();
      }
      break;
      
    case 'state':
      online.board = msg.board;
      online.turn = msg.turn;
      renderBoard();
      
      if (msg.winner) {
        if (msg.winner === 'D') {
          statusEl.textContent = 'Ничья!';
          scores.T++;
          showEmojiReaction('🤝');
        } else {
          statusEl.textContent = `Победил ${msg.winner === 'X' ? '❌' : '⭕'}!`;
          scores[msg.winner]++;
          showEmojiReaction(msg.winner === online.mySymbol ? '🎉' : '😢');
        }
        updateScores();
        online.active = false;
        stopTimer();
      } else {
        statusEl.textContent = `Ход: ${msg.turn === 'X' ? '❌' : '⭕'}`;
        
        if (msg.turn === online.mySymbol) {
          startTimer();
        } else {
          stopTimer();
        }
      }
      break;
      
    case 'chat':
      addChatMessage(msg.sender, msg.message);
      break;
      
    case 'opponent_left':
      onlineInfo.textContent = 'Соперник отсоединился...';
      stopTimer();
      break;
  }
}

/* ====== Event Listeners ====== */
btnLocal.onclick = () => { setMode('local'); resetBoard(); };
btnOnline.onclick = () => { setMode('online'); resetBoard(); };

btnVsAI.onclick = () => {
  isPlayingWithAI = true;
  resetBoard();
  const name = localNameInput.value || 'Неоновый воин';
  myNameDisplay.textContent = name;
  opponentNameDisplay.textContent = '🤖 ИИ';
};

createBtn.onclick = async () => {
  const name = onlineNameInput.value.trim() || 'Неоновый воин';
  const code = await apiCreate();
  if (!code) return;
  
  roomCodeInput.value = code;
  connectWS(code, name);
  createPanel.classList.remove('hidden');
  joinPanel.classList.add('hidden');
};

joinBtn.onclick = () => {
  joinPanel.classList.toggle('hidden');
  createPanel.classList.add('hidden');
};

joinRoomBtn.onclick = () => {
  const code = joinCodeInput.value.trim().toUpperCase();
  if (!code) {
    joinMsg.textContent = 'Введите код комнаты';
    return;
  }
  
  const name = onlineNameInput.value.trim() || 'Неоновый воин';
  joinMsg.textContent = 'Соединяюсь...';
  connectWS(code, name);
  joinPanel.classList.remove('hidden');
};

copyCodeBtn.onclick = () => {
  navigator.clipboard.writeText(roomCodeInput.value)
    .then(() => {
      copyCodeBtn.textContent = '✅ Скопировано!';
      setTimeout(() => {
        copyCodeBtn.textContent = '📋 Скопировать код';
      }, 2000);
    });
};

resetAllBtn.onclick = () => {
  scores = { X: 0, O: 0, T: 0 };
  updateScores();
  resetBoard();
  isPlayingWithAI = false;
  
  if (mode === 'online' && online.ws) {
    online.ws.close();
    online.ws = null;
  }
};

restartBtn.onclick = () => {
  if (mode === 'local') {
    resetBoard();
  } else if (mode === 'online' && online.ws) {
    online.ws.send(JSON.stringify({ type: 'rematch' }));
  }
};

sendChatBtn.onclick = () => {
  const message = chatInput.value.trim();
  if (message && online.ws) {
    online.ws.send(JSON.stringify({ type: 'chat', message }));
    addChatMessage('Вы', message);
    chatInput.value = '';
  }
};

chatInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    sendChatBtn.click();
  }
});

/* ====== Initialize Game ====== */
setMode('local');
resetBoard();
updateScores();
</script>
</body>
</html>
